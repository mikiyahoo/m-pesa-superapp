<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, initial-scale=1.0">
    <title>Send to Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 360px;
            height: 808px; /* 760px screen + 48px system nav */
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 4px 16px;
            flex-shrink: 0;
        }

        .status-bar .time {
            font-size: 13px;
            font-weight: 600;
            color: #333333;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666666;
        }

        .status-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            display: block;
        }

        /* ---------- Header ---------- */
        .screen-header {
            display: flex;
            align-items: center;
            padding: 12px 16px 26px 16px;
            flex-shrink: 0;
            position: relative;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            border-radius: 50%;
            transition: background-color 0.15s ease;
        }

        .close-btn:active { background-color: #f2f2f2; }

        .close-btn svg {
            width: 22px;
            height: 22px;
            stroke: #333333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
        }

        .screen-header h1 {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            color: #333333;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* ---------- Form ---------- */
        .form {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 18px;
            position: relative;
            z-index: 1;
        }

        .form::-webkit-scrollbar { display: none; }

        .field { margin-bottom: 46px; }

        .field.with-hint { margin-bottom: 26px; }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: #555555;
            letter-spacing: 0.9px;
            margin-bottom: 10px;
        }

        .field .underline {
            border-bottom: 1px solid #D5D5D5;
            padding-bottom: 9px;
        }

        .field input {
            width: 100%;
            border: none;
            outline: none;
            background: none;
            font-family: 'Barlow', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #1c1c1c;
        }

        .field input::placeholder {
            color: #B4B4B4;
            font-weight: 400;
        }

        .hint {
            font-size: 11px;
            font-weight: 500;
            color: #B4B4B4;
            letter-spacing: 0.7px;
            margin-top: 8px;
        }

        .counter {
            font-size: 11px;
            font-weight: 500;
            color: #B4B4B4;
            letter-spacing: 0.5px;
            margin-top: 8px;
            text-align: right;
        }

        /* ---------- Bank select ---------- */
        .bank-row {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .bank-row .bank-name {
            flex-grow: 1;
            font-size: 16px;
            font-weight: 700;
            color: #1c1c1c;
        }

        .bank-row .bank-name.placeholder {
            font-weight: 500;
            color: #9a9a9a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            flex-shrink: 0;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: #777777;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chevron { transition: transform 0.2s ease; }
        .chevron.open { transform: rotate(180deg); }

        /* ---------- Bank list ---------- */
        .bank-list {
            display: none;
            margin-top: 10px;
            border: 1px solid #ececec;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            max-height: 232px;
            overflow-y: auto;
            background: #ffffff;
        }

        .bank-list.open { display: block; }

        .bank-list::-webkit-scrollbar { width: 0; }

        .bank-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background-color 0.15s ease;
        }

        .bank-option:last-child { border-bottom: none; }
        .bank-option:active { background-color: #f7f7f7; }
        .bank-option.selected { background-color: #F2FBF6; }

        .bank-option img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .bank-option span {
            font-size: 13.5px;
            font-weight: 500;
            color: #444444;
            line-height: 1.25;
        }

        /* ---------- Pattern watermark ---------- */
        .pattern {
            position: absolute;
            right: -162px;
            bottom: -134px;
            width: 420px;
            height: auto;
            filter: invert(5%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- Continue ---------- */
        .continue-wrap {
            padding: 12px 18px 20px 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .continue-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            background-color: #F0F0F0;
            color: #C0C0C0;
            font-family: 'Barlow', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1.2px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .continue-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .continue-btn.enabled {
            background-color: #2FC56D;
            color: #ffffff;
            cursor: pointer;
        }

        .continue-btn.enabled:active { transform: scale(0.99); }

        /* ---------- Android system navigation ---------- */
        .system-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            height: 48px;
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            color: #666666;
            position: relative;
            z-index: 1;
        }

        .system-nav svg {
            width: 19px;
            height: 19px;
            display: block;
        }

        /* ---------- Fayda modal ---------- */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 30;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 26px 22px 24px 22px;
            text-align: center;
            position: relative;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16);
            transform: translateY(12px) scale(0.98);
            transition: transform 0.25s ease;
        }

        .modal-overlay.show .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            border-radius: 50%;
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
            stroke: #F0333F;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
        }

        .modal-card img.fayda {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin: 6px auto 20px auto;
            display: block;
        }

        .modal-card h2 {
            font-size: 22px;
            font-weight: 500;
            color: #3a3a3a;
            letter-spacing: 0.4px;
            margin-bottom: 12px;
        }

        .modal-card p {
            font-size: 13.5px;
            font-weight: 400;
            color: #777777;
            line-height: 1.5;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .modal-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 26px;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .modal-btn:active { transform: scale(0.99); }

        .modal-btn.primary {
            background-color: #2FC56D;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .modal-btn.secondary {
            background-color: #F1F1F1;
            color: #6E6E6E;
        }

        /* ---------- Toast ---------- */
        .toast {
            position: absolute;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(9, 126, 70, 0.95);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 10px 16px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="mobile-container">

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:00</span>
            <div class="status-icons">
                <!-- Bluetooth -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71L13.41 12l4.3-4.29ZM13 5.83l1.88 1.88L13 9.59V5.83Zm1.88 10.46L13 18.17v-3.76l1.88 1.88Z"/>
                </svg>
                <!-- Wi-Fi -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.1 8.9a14.2 14.2 0 0 1 19.8 0L12.9 20.3a1.1 1.1 0 0 1-1.8 0L2.1 8.9Z"/>
                </svg>
                <!-- Cellular signal -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.9 3.6v16.1c0 .5-.4.9-.9.9H4.6c-.8 0-1.2-1-.6-1.5L19.4 3c.6-.6 1.5-.2 1.5.6Z"/>
                </svg>
                <!-- Battery -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.6 1.8h4.8c.5 0 .9.4.9.9v1.1H8.7V2.7c0-.5.4-.9.9-.9Z"/>
                    <rect x="6.6" y="4.3" width="10.8" height="17.9" rx="2.2"/>
                </svg>
            </div>
        </div>

        <!-- Header -->
        <header class="screen-header">
            <button class="close-btn" onclick="window.location.href='Home Screen.html'" aria-label="Close">
                <svg viewBox="0 0 24 24"><path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"/></svg>
            </button>
            <h1>SEND TO BANK</h1>
        </header>

        <!-- Form -->
        <div class="form">

            <!-- Select bank -->
            <div class="field">
                <label>SELECT BANK</label>
                <div class="underline">
                    <div class="bank-row" onclick="toggleBankList()">
                        <span class="bank-name placeholder" id="bankName">Select bank</span>
                        <span class="icon-btn chevron" id="bankChevron">
                            <svg viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></svg>
                        </span>
                        <button class="icon-btn" onclick="event.stopPropagation(); resetForm();" aria-label="Reset">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 9.2V4.6"/>
                                <path d="M4 9.2h4.6"/>
                                <path d="M4.6 9.2a8 8 0 1 1-.7 5"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="bank-list" id="bankList"></div>
            </div>

            <!-- Account number -->
            <div class="field">
                <label>BANK ACCOUNT NUMBER</label>
                <div class="underline">
                    <input type="text" id="accountNumber" inputmode="numeric" maxlength="16"
                           placeholder="Enter Bank Account Number" oninput="onAccountInput(this)">
                </div>
            </div>

            <!-- Amount -->
            <div class="field with-hint">
                <label>AMOUNT</label>
                <div class="underline">
                    <input type="text" id="amount" inputmode="decimal" placeholder="Birr  0" oninput="onAmountInput(this)">
                </div>
                <p class="hint">BALANCE: 5,000.00 BIRR</p>
            </div>

            <!-- Description -->
            <div class="field">
                <label>DESCRIPTION (OPTIONAL)</label>
                <div class="underline">
                    <input type="text" id="description" maxlength="10" placeholder="Enter description" oninput="onDescriptionInput(this)">
                </div>
                <p class="counter" id="descCounter">0/10</p>
            </div>

        </div>

        <!-- Pattern watermark -->
        <img class="pattern" src="assets/M-PESA-pattern.svg" alt="">

        <!-- Continue -->
        <div class="continue-wrap">
            <button class="continue-btn" id="continueBtn" onclick="submitTransfer()" disabled>
                <span>CONTINUE</span>
                <svg viewBox="0 0 24 24"><path d="M4 12h15M13.5 6.5 20 12l-6.5 5.5"/></svg>
            </button>
        </div>

        <!-- Android System Navigation -->
        <div class="system-nav">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14.8 4.8 6 12l8.8 7.2V4.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="6.9" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5.4" y="5.4" width="13.2" height="13.2" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>

        <!-- Link Fayda ID modal -->
        <div class="modal-overlay" id="faydaModal">
            <div class="modal-card">
                <button class="modal-close" onclick="closeFayda()" aria-label="Close">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
                <img class="fayda" src="assets/fayda-logo-hq.png" alt="Fayda">
                <h2>LINK YOUR FAYDA ID</h2>
                <p>Link your account with Fayda to enjoy a more secure and seamless experience on the app.</p>
                <button class="modal-btn primary" onclick="linkFayda()">CONTINUE</button>
                <button class="modal-btn secondary" onclick="closeFayda()">SKIP</button>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        const BALANCE = 5000;

        const BANKS = [
            { name: 'Commercial Bank of Ethiopia', logo: 'cbe-logo.png' },
            { name: 'Awash Bank',                  logo: 'awass-bank.png' },
            { name: 'Dashen Bank',                 logo: 'dashen-bank.png' },
            { name: 'Bank of Abyssinia',           logo: 'abyssinya-bank.png' },
            { name: 'Amhara Bank',                 logo: 'amhara-bank.png' },
            { name: 'Hibret Bank',                 logo: 'Hibret-bank.png' },
            { name: 'Cooperative Bank of Oromia',  logo: 'coop-bank.png' },
            { name: 'Nib International Bank',      logo: 'nib-bank.png' },
            { name: 'Oromia International Bank',   logo: 'oromia-i-bank.png' },
            { name: 'Wegagen Bank',                logo: 'wegagen-bank.png' },
            { name: 'Zemen Bank',                  logo: 'zemen-bank.png' }
        ];

        const BANK_PLACEHOLDER = 'Select bank';
        let selectedBank = '';

        /* ---------- Bank list ---------- */
        function buildBankList() {
            const list = document.getElementById('bankList');
            list.innerHTML = BANKS.map(b => `
                <div class="bank-option${b.name === selectedBank ? ' selected' : ''}" onclick="selectBank('${b.name.replace(/'/g, "\\'")}')">
                    <img src="assets/banks%20logo/${b.logo}" alt="">
                    <span>${b.name}</span>
                </div>`).join('');
        }

        function toggleBankList() {
            const list = document.getElementById('bankList');
            const chevron = document.getElementById('bankChevron');
            const open = list.classList.toggle('open');
            chevron.classList.toggle('open', open);
        }

        function selectBank(name) {
            selectedBank = name;
            const label = document.getElementById('bankName');
            label.textContent = name;
            label.classList.remove('placeholder');
            buildBankList();
            toggleBankList();
            validate();
        }

        /* ---------- Inputs ---------- */
        function onAccountInput(el) {
            el.value = el.value.replace(/[^0-9]/g, '');
            validate();
        }

        function onAmountInput(el) {
            // digits and a single decimal point, thousands separated
            let raw = el.value.replace(/[^0-9.]/g, '');
            const parts = raw.split('.');
            let whole = parts[0].replace(/^0+(?=\d)/, '');
            let value = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            if (parts.length > 1) value += '.' + parts[1].slice(0, 2);
            el.value = value;
            validate();
        }

        function onDescriptionInput(el) {
            document.getElementById('descCounter').textContent = el.value.length + '/10';
        }

        function amountValue() {
            const raw = document.getElementById('amount').value.replace(/,/g, '');
            return raw === '' ? 0 : parseFloat(raw);
        }

        /* ---------- Validation ---------- */
        function validate() {
            const account = document.getElementById('accountNumber').value.trim();
            const amount = amountValue();
            const ok = selectedBank !== '' && account.length >= 8 && amount > 0 && amount <= BALANCE;

            const btn = document.getElementById('continueBtn');
            btn.classList.toggle('enabled', ok);
            btn.disabled = !ok;
        }

        /* ---------- Actions ---------- */
        function resetForm() {
            selectedBank = '';
            const bankLabel = document.getElementById('bankName');
            bankLabel.textContent = BANK_PLACEHOLDER;
            bankLabel.classList.add('placeholder');
            document.getElementById('accountNumber').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            document.getElementById('descCounter').textContent = '0/10';
            document.getElementById('bankList').classList.remove('open');
            document.getElementById('bankChevron').classList.remove('open');
            buildBankList();
            validate();
            showToast('FORM RESET');
        }

        function submitTransfer() {
            const amount = amountValue();
            if (amount > BALANCE) {
                showToast('INSUFFICIENT BALANCE');
                return;
            }
            showToast('SENDING ' + amount.toLocaleString('en-US', { minimumFractionDigits: 2 }) + ' BIRR');
        }

        /* ---------- Toast ---------- */
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        /* ---------- Fayda modal ---------- */
        const FAYDA_DELAY = 2000; // 2s after the screen opens

        function openFayda() {
            document.getElementById('faydaModal').classList.add('show');
        }

        function closeFayda() {
            document.getElementById('faydaModal').classList.remove('show');
        }

        function linkFayda() {
            closeFayda();
            try { sessionStorage.setItem('faydaReturn', 'Send to Bank.html'); } catch (e) {}
            window.location.href = 'Fayda Verification.html';
        }

        setTimeout(openFayda, FAYDA_DELAY);

        buildBankList();
        validate();
    </script>
</body>
</html>
