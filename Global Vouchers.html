    <script>
        /* ================================================================
           Catalogue. Per the BRD the initial launch has three products:
           Netflix, Google Play and PUBG Mobile (the User Journey also shows
           Spotify, which the BRD does not list, so it is left out).
           Denominations, ETB prices, the 5 ETB service fee and the expiry
           period are SAMPLE values: the journey only gives $10 = 1,645 ETB
           + 5 ETB fee. Live values come from Pincoon / pricing config.
           ================================================================ */
        const ETB_PER_USD = 164.5;      // sample, from $10 -> 1,645 ETB
        const SERVICE_FEE = 5;          // sample, per voucher
        const EXPIRY_MONTHS = 12;       // sample: shown only when the provider sends an expiry
        const ME = { name: 'Mikias Dereje', phone: '0911 032 052' };

        const PRODUCTS = {
            netflix: {
                name: 'Netflix', category: 'Streaming', prefix: 'NFLX', tagline: 'Watch your favorite shows and movies',
                desc: 'Pay for your Netflix plan with a voucher to watch your favorite movies.',
                denoms: [10, 20, 30], plans: ['Basic', 'Standard', 'Premium'], unavailable: [30],
                steps: ['Go to Netflix', 'Sign in to your account', 'Enter your code and enjoy!'],
                link: ['Netflix Ethiopia - Watch TV Shows Online, Watch Movies Online', 'https://www.netflix.com/et/']
            },
            googleplay: {
                name: 'Google Play', category: 'Apps & games', prefix: 'GPLY', tagline: 'Get your favorite apps and games',
                desc: 'Top up your Google Play balance with a voucher to get your favorite apps and games.',
                denoms: [10, 20, 30], plans: ['Mini', 'Plus', 'Max'], unavailable: [],
                steps: ['Go to Google Play', 'Sign in to your Google account', 'Enter your code and enjoy!'],
                link: ['Google Play - Redeem a voucher code', 'https://play.google.com/redeem']
            },
            pubg: {
                name: 'PUBG Mobile', category: 'Gaming', prefix: 'PUBG', tagline: 'Top up your PUBG',
                desc: 'Top up your PUBG Mobile account with a voucher to unlock skins, outfits and more.',
                denoms: [10, 20, 30], plans: ['60 UC', '325 UC', '660 UC'], unavailable: [],
                steps: ['Go to the PUBG Mobile redeem page', 'Sign in with your player ID', 'Enter your code and enjoy!'],
                link: ['Midasbuy - PUBG Mobile redeem', 'https://www.midasbuy.com/']
            },
            spotify: {
                name: 'Spotify', category: 'Music', prefix: 'SPTF', tagline: 'Enjoy endless music',
                desc: 'Pay for Spotify Premium with a voucher to enjoy endless music.',
                denoms: [10, 20, 30], plans: ['Individual', 'Duo', 'Family'], unavailable: [],
                steps: ['Go to Spotify', 'Sign in to your account', 'Enter your code and enjoy!'],
                link: ['Spotify - Redeem your voucher', 'https://www.spotify.com/redeem/']
            }
        };
        const ORDER = ['netflix', 'googleplay', 'pubg', 'spotify'];
        const CAPSULE = '<div class="capsule"><button onclick="openMore()" aria-label="More options"><svg viewBox="0 0 24 24" class="dots"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="2.2"/><circle cx="18.5" cy="12" r="1.7"/></svg></button><i></i><button onclick="leaveApp()" aria-label="Close mini app"><svg viewBox="0 0 24 24" class="ring"><circle cx="12" cy="12" r="7.6"/><circle cx="12" cy="12" r="2.6" class="core"/></svg></button></div>';

        /* brand marks: simple placeholders until the partners' official logos are supplied */
        const MARK = {
            netflix: '<svg viewBox="0 0 24 24"><path d="M6.5 2.5h3.6l4 11.5V2.5h3.4v19l-3.6-.5-4-11.4V20.6l-3.4.4Z" fill="#E50914"/></svg>',
            googleplay: '<svg viewBox="0 0 24 24"><path d="M4.2 2.6 13.6 12l-9.4 9.4c-.3-.2-.5-.6-.5-1.1V3.7c0-.5.2-.9.5-1.1Z" fill="#00C3FF"/><path d="m16.8 8.8-3.2 3.2-9.4-9.4c.3-.2.8-.2 1.2 0Z" fill="#00E676"/><path d="m16.8 15.2-11.4 6.2c-.4.2-.9.2-1.2 0l9.4-9.4Z" fill="#FF3A44"/><path d="M20.3 10.7c.9.6.9 2 0 2.6l-3.5 1.9-3.2-3.2 3.2-3.2Z" fill="#FFD400"/></svg>',
            spotify: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1DB954"/><path d="M6.8 9.4c3.6-1.1 7.6-.8 10.6.9M7.4 12.4c3-.8 6.2-.5 8.7.9M8 15.2c2.4-.6 4.8-.4 6.8.7" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
            pubg: '<svg viewBox="0 0 24 24"><text x="12" y="15.2" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="800" font-size="8.6" fill="#F2A900">PUBG</text></svg>'
        };
        const WORD = {
            netflix: '<span class="gw gw-netflix">NETFLIX</span>',
            googleplay: '<span class="gw gw-gp">' + MARK.googleplay + 'Google Play</span>',
            pubg: '<span class="gw gw-pubg">PUBG<small>MOBILE</small></span>',
            spotify: '<span class="gw gw-spotify">' + MARK.spotify + 'Spotify</span>'
        };
        /* the voucher card: wordmark, value, M-PESA seal. Scales to any width (container units). */
        /* cover photos (supplied artwork); products without one keep the drawn card */
        const COVER = {
            netflix: ['assets/NETFLIX.jpg', 'center'],
            spotify: ['assets/SPOTIFY.jpg', 'center 30%'],
            pubg: ['assets/PUGB.jpg', 'center 20%']
        };

        function giftCard(key, label, tagline) {
            const left = tagline != null ? (tagline ? '<span class="gc-tag">' + tagline + '</span>' : '<span></span>')
                : '<span><small>VOUCHER</small><b>' + label + '</b></span>';
            const cover = COVER[key]
                ? '<img class="cover" src="' + COVER[key][0] + '" alt="" style="object-position:' + COVER[key][1] + '"><span class="shade"></span>'
                : '<span class="wm">' + MARK[key] + '</span><span class="shine"></span>';
            return '<div class="gc gc-' + key + (COVER[key] ? ' has-cover' : '') + '" aria-hidden="true">' + cover
                + WORD[key]
                + '<div class="gc-bot">' + left
                + '<span class="mp"><img src="assets/M-PESA-money-icon.svg" alt=""></span></div></div>';
        }

        function mark(key, size) {
            return '<span class="mark m-' + key + '" aria-hidden="true"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '>' + MARK[key] + '</span>';
        }

        /* ---------- Formatting ---------- */
        function money(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function whole(n) { return n.toLocaleString('en-US'); }
        function priceOf(usd) { return Math.round(usd * ETB_PER_USD); }
        function totalOf(usd) { return priceOf(usd) + SERVICE_FEE; }
        /* "21 Sep 2026", as elsewhere in the app (browsers differ on "Sep" / "Sept") */
        const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function fmtDate(d) { return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
        function fmtTime(d) { return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
        function addMonths(d, m) { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; }
        function daysAgo(n, h) { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h || 10, 24, 0, 0); return d; }
        function rand(n, set) { let s = ''; for (let i = 0; i < n; i++) s += set[Math.floor(Math.random() * set.length)]; return s; }
        const ALNUM = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        function newRef() { return 'MPV' + rand(8, ALNUM); }                      // unique transaction reference
        function newCode(p) { return PRODUCTS[p].prefix + '-' + rand(4, ALNUM) + '-' + rand(4, ALNUM); }
        function maskCode(c) { const parts = c.split('-'); return parts[0] + '-••••-' + parts[2]; }
        /* the package name stands for the value: customers never see dollars */
        function pk(key, usd) { const P = PRODUCTS[key]; return P.plans[P.denoms.indexOf(usd)]; }
        function voucherName(v) { return PRODUCTS[v.product].name + ' ' + pk(v.product, v.usd); }

        /* ================================================================
           State. Demo scenarios come from the sidebar (?gv=...):
             empty    first visit, nothing bought yet
             lowbal   wallet below the price (insufficient balance)
             payfail  the M-PESA payment fails (no debit)
             issuefail payment taken, voucher not issued -> automatic reversal
             smsfail  voucher issued, SMS not delivered -> resend
           A PIN of 0000 is always treated as incorrect.
           ================================================================ */
        const STATE_KEY = 'gvState';

        function seedState() {
            const v1 = daysAgo(15, 14), v2 = daysAgo(53, 9), v3 = daysAgo(399, 18), f1 = daysAgo(8, 11), f2 = daysAgo(26, 20);
            const vouchers = [
                { id: 'v1', product: 'netflix', usd: 10, code: 'NFLX-7K2M-9QXA', bought: v1.toISOString(), expires: addMonths(v1, EXPIRY_MONTHS).toISOString(), status: 'active', ref: 'MPV4K7Q2X9A', sms: 'sent' },
                { id: 'v2', product: 'googleplay', usd: 20, code: 'GPLY-3H8D-QW2L', bought: v2.toISOString(), expires: addMonths(v2, EXPIRY_MONTHS).toISOString(), status: 'redeemed', ref: 'MPV8RT3MZ2C', sms: 'sent' },
                { id: 'v3', product: 'pubg', usd: 10, code: 'PUBG-9X2C-71MN', bought: v3.toISOString(), expires: addMonths(v3, EXPIRY_MONTHS).toISOString(), status: 'redeemed', ref: 'MPV2NC6PL8D', sms: 'sent' }
            ];
            const tx = vouchers.map(v => ({ ref: v.ref, product: v.product, usd: v.usd, on: v.bought, status: 'success', voucher: v.id }));
            tx.push({ ref: 'MPV7DQ4KW1E', product: 'pubg', usd: 20, on: f1.toISOString(), status: 'failed', reason: 'payment' });
            tx.push({ ref: 'MPV5LW9HT3F', product: 'netflix', usd: 20, on: f2.toISOString(), status: 'failed', reason: 'issuance' });
            return { wallet: 5000, vouchers: vouchers, tx: tx, scenario: 'normal' };
        }

        function loadState() {
            try { const s = JSON.parse(sessionStorage.getItem(STATE_KEY)); if (s && s.vouchers) return s; } catch (e) {}
            return seedState();
        }
        function save() { try { sessionStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) {} }

        let S = loadState();
        const START = new URLSearchParams(location.search);
        const scenario = START.get('gv');
        if (scenario) {
            S = seedState();
            S.scenario = scenario;
            if (scenario === 'empty') { S.vouchers = []; S.tx = []; }
            if (scenario === 'lowbal') S.wallet = 1200;
        }
        save();

        /* ================================================================
           Navigation: a small stack of steps. Tab roots show the bottom
           navigation; everything inside the purchase flow hides it so the
           customer is never one tap away from abandoning a payment.
           ================================================================ */
        const ROOTS = ['stepHome', 'stepMine', 'stepTx'];
        let stack = ['stepHome'];

        function show(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s.id === id));
            document.getElementById('tabs').classList.toggle('show', ROOTS.includes(id));
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === id));
            const sc = document.querySelector('#' + id + ' .scroll');
            if (sc) sc.scrollTop = 0;
            note(id);
        }
        function go(id) { stack.push(id); show(id); }
        function back() {
            if (document.getElementById('sheet').classList.contains('show')) { closeSheet(); return; }
            if (stack.length <= 1) { leaveApp(); return; }
            stack.pop();
            const top = stack[stack.length - 1];
            if (top === 'stepMine') renderMine();
            if (top === 'stepTx') renderTx();
            if (top === 'stepVoucher') renderVoucher();
            show(top);
        }
        function goTab(id) {
            stack = [id];
            if (id === 'stepMine') renderMine();
            if (id === 'stepTx') renderTx();
            if (id === 'stepHome') renderHome();
            show(id);
        }
        function leaveApp() {
            if (procBusy) { showToast('Please wait, your payment is in progress'); return; }
            window.location.href = 'Mini Apps.html';
        }

        /* the capsule's ••• : the mini app's own menu */
        function openMore() {
            const row = (icon, label, act) => '<button class="menu-row" onclick="closeSheet(); ' + act + '"><span class="ic"><svg viewBox="0 0 24 24">' + icon + '</svg></span>' + label + '</button>';
            document.getElementById('sheetBody').innerHTML = '<div class="grab"></div>'
                + '<div class="mini-id"><span class="logo"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1V10a2 2 0 0 0 0 4v2.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V14a2 2 0 0 0 0-4V7.5Z"/></svg></span>'
                + '<span><b>Global Vouchers</b><small>M-PESA mini app &middot; by Safaricom</small></span></div>'
                + row('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><path d="M12 16.8v.1"/>', 'Help &amp; Support', 'openHelp()')
                + row('<path d="m12 3.8 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.9l5.8-.8L12 3.8Z"/>', 'Add to Favourites', "showToast('Added to your favourite mini apps')")
                + row('<path d="M6.5 3.5h8l4 4v13h-12Z"/><path d="M14.5 3.5v4h4M9.5 12h6M9.5 15.5h6"/>', 'Terms &amp; Conditions', 'openTerms()')
                + row('<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/>', 'Share', "showToast('Link copied')");
            document.getElementById('sheet').classList.add('show');
        }

        /* terms & conditions (sample wording, to be replaced by Legal) */
        function openTerms() {
            /* [title, text, warn?] : the warning term sits in a red card */
            const T = [
                ['Who Provides Vouchers', 'Vouchers are issued by the brand through our partner, not by M-PESA directly. M-PESA sells them and takes payment.'],
                ['Prices and Fees', 'Prices are shown in ETB and include a <span class="hl">' + SERVICE_FEE + ' ETB service fee</span>. The total is shown before you pay.'],
                ['Your Code', 'Your code is sent by SMS and kept in My Vouchers. Keep it private: anyone with the code can use it.'],
                ['No Refunds After Issue', 'A voucher can\u2019t be cancelled or refunded once the code is issued. If a code can\u2019t be issued, your money is returned to M-PESA automatically.', true],
                ['Redeeming', 'Codes are redeemed on the brand\u2019s own site or app and follow that brand\u2019s rules.'],
                ['Help', 'For any problem, call the M-PESA Call Center on 127 with your transaction ID.']
            ];
            document.getElementById('termsBody').innerHTML = '<div class="terms"><div class="term-card">'
                + T.map((t, i) => '<div class="term' + (t[2] ? ' warn' : '') + '">'
                    + (t[2] ? '<span class="alert">!</span>' : '') + '<span class="n">' + (i + 1) + '</span>'
                    + '<div><b>' + t[0] + '</b><p>' + t[1] + '</p></div></div>').join('') + '</div>'
                + '<button class="term-help" onclick="showToast(\'Calling M-PESA Call Center\')"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4.5h3.5l1.5 4-2 1.3a10 10 0 0 0 6.2 6.2l1.3-2 4 1.5V19a1.5 1.5 0 0 1-1.5 1.5A15.5 15.5 0 0 1 3.5 6 1.5 1.5 0 0 1 5 4.5Z"/></svg></span>'
                + '<span class="t"><b>Need Help?</b>Call M-PESA Call Center on 127<small>Please have your transaction ID ready.</small></span>'
                + '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>'
                + '</div>';
            go('stepTerms');
        }

        /* developer notes beside the phone, for the screens where a business rule matters */
        const NOTES = {
            stepProduct: 'Out-of-stock or unavailable denominations are shown but cannot be selected (BRD: unavailable vouchers are not purchasable). Availability comes from Pincoon.',
            stepReview: 'Service fee and total must be visible before confirmation (BRD). Wallet balance is validated here, before the PIN, so an insufficient balance never reaches the payment step.',
            stepPin: 'Payment and voucher issuance are separate stages. A purchase is only successful once Pincoon issues the voucher; if the customer was debited and issuance fails, the amount is reversed automatically.',
            stepVoucher: 'Codes are masked in lists and only revealed on the voucher screen of the buyer (BRD: codes accessible only to the purchaser). Viewing a code from My Vouchers or Transactions asks for the M-PESA PIN; the code is hidden again each time the voucher is reopened.',
            stepTx: 'Transactions = what I paid for (amounts, status, reference). My Vouchers = what I own (codes, purchase date, redemption). Codes are not shown in transaction lists.'
        };
        function note(id) {
            if (window.prototypeMode && window.prototypeMode.devNote) window.prototypeMode.devNote(NOTES[id] || '');
        }

        /* ================================================================
           Tab 1 - Vouchers home: intro, trust points, catalogue, how it works
           ================================================================ */
        let catalogueReady = false;

        let homeCat = 'All';

        function storeTile(key, wide, popular) {
            const P = PRODUCTS[key];
            const from = Math.min.apply(null, P.denoms.filter(d => !P.unavailable.includes(d)));
            return '<button class="tile' + (wide ? ' wide' : '') + '" onclick="openProduct(\'' + key + '\')">' + giftCard(key, null, P.tagline)
                + '<span class="meta"><span><b>' + P.name + '</b><small>From ' + whole(totalOf(from)) + ' ETB</small></span>'
                + (popular ? '<span class="tag">POPULAR</span>' : '') + '</span></button>';
        }

        function setHomeCat(c) { homeCat = c; renderHome(); }

        function renderHome() {
            const cats = ['All'].concat(ORDER.map(k => PRODUCTS[k].category).filter((c, i, a) => a.indexOf(c) === i));
            const shown = ORDER.filter(k => homeCat === 'All' || PRODUCTS[k].category === homeCat);
            document.getElementById('homeBody').innerHTML = '<div class="hero"><img class="pat" src="assets/M-PESA-pattern.svg" alt="">'
                + '<div class="hero-bar"><button class="icon-btn on-dark" onclick="leaveApp()" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></button><h1>Global Vouchers</h1>' + CAPSULE.replace('class="capsule"', 'class="capsule light"') + '</div>'
                + '<div class="hero-in"><div class="hero-txt">'
                + '<h2>VOUCHERS FOR THE APPS YOU LOVE</h2><p>Pay with M-PESA.</p></div>'
                + '<div class="stack">' + giftCard('spotify', null, '') + giftCard('pubg', null, '') + giftCard('netflix', null, '') + '</div></div>'
                + '</div>'
                + '<div class="panel">'
                + '<div class="section" style="margin-top:4px"><h2>Vouchers</h2></div>'
                + '<div class="chips">' + cats.map(c => '<button class="chip' + (homeCat === c ? ' on' : '') + '" onclick="setHomeCat(\'' + c + '\')">' + c + '</button>').join('') + '</div>'
                + (catalogueReady
                    /* the first card is featured (wide, POPULAR); if the rest leave one alone, it goes wide too */
                    ? '<div class="store">' + shown.map((k, i) => storeTile(k, i === 0 || (shown.length % 2 === 0 && i === shown.length - 1), i === 0 && homeCat === 'All')).join('') + '</div>'
                    : '<p class="loading-note"><span class="dotspin"></span>Checking availability&hellip;</p><div class="skel" style="height:140px"></div><div class="skel"></div>')
                + '<div style="height:16px"></div></div>';
            paintCount();
        }

        function paintCount() {
            const n = S.vouchers.filter(v => v.status === 'active').length;
            document.getElementById('mineCount').textContent = n ? String(n) : '';
            document.getElementById('mineCount').style.display = n ? '' : 'none';
        }

        /* ================================================================
           Product details + denomination
           ================================================================ */
        let cur = { product: null, usd: null };

        function openProduct(key) {
            cur = { product: key, usd: null };
            /* preselect the first available value so the price is visible straight away */
            const P = PRODUCTS[key];
            cur.usd = P.denoms.find(d => !P.unavailable.includes(d)) || null;
            renderProduct();
            go('stepProduct');
        }

        function openGuide(key) {
            document.getElementById('sheetBody').innerHTML = '<div class="grab"></div>'
                + '<div class="title-row"><h3>How to Redeem</h3>' + mark(key, 34) + '</div>'
                + '<p>Use your ' + PRODUCTS[key].name + ' voucher code in ' + PRODUCTS[key].steps.length + ' steps:</p>'
                + guideHtml(key)
                + '<div class="acts"><button class="btn" onclick="closeSheet()">Got it</button></div>';
            document.getElementById('sheet').classList.add('show');
        }

        function guideHtml(key) {
            const P = PRODUCTS[key];
            return '<ol class="guide">' + P.steps.map((s, i) => '<li><em>' + (i + 1) + '</em><span>' + s
                + (i === 0 && P.link ? '<a class="glink" href="' + P.link[1] + '" target="_blank" rel="noopener">' + P.link[0] + '</a>' : '')
                + '</span></li>').join('') + '</ol>';
        }

        function renderProduct() {
            const P = PRODUCTS[cur.product];
            document.getElementById('productTitle').textContent = P.name;
            document.getElementById('productBody').innerHTML = '<div class="p-stage">' + giftCard(cur.product, pk(cur.product, cur.usd || P.denoms[0])) + '</div>'
                + '<div class="p-hero title-row" style="margin-top:4px"><span><b>' + P.name + ' Voucher</b></span>'
                + '</div>'
                + '<p class="p-desc" style="margin-top:6px">' + P.desc + '</p>'
                + '<div class="section"><h2>Choose a package</h2></div>'
                + '<div class="denoms">' + P.denoms.map(d => {
                    const off = P.unavailable.includes(d);
                    return '<button class="denom' + (cur.usd === d ? ' on' : '') + '"' + (off ? ' disabled' : ' onclick="pickDenom(' + d + ')"') + '>'
                        + '<b>' + pk(cur.product, d) + '</b><small>' + (off ? 'Unavailable' : whole(priceOf(d)) + ' ETB') + '</small></button>';
                }).join('') + '</div>'
                + (cur.usd
                    ? '<div class="you-pay"><span>' + P.name + ' ' + pk(cur.product, cur.usd) + '</span><b>' + money(totalOf(cur.usd)) + ' ETB</b></div>'
                    : '')
                + '<div class="section"><h2>Redemption guide</h2></div>' + guideHtml(cur.product)
                + '<div style="height:16px"></div>';
            document.getElementById('productGo').disabled = !cur.usd;
        }

        function pickDenom(d) { cur.usd = d; renderProduct(); }

        /* ================================================================
           Review & pay (balance validated here, before the PIN)
           ================================================================ */
        function toReview() { renderReview(); go('stepReview'); }

        function renderReview() {
            const P = PRODUCTS[cur.product], price = priceOf(cur.usd), total = totalOf(cur.usd);
            const short = total - S.wallet;
            let html = '<div class="card" style="margin-top:6px">'
                + '<div class="v-sum">' + mark(cur.product) + '<span><b>' + P.name + ' Voucher</b><small>' + pk(cur.product, cur.usd) + ' package</small></span></div>'
                + '<div class="rows">'
                + '<div class="row"><span>Voucher type</span><b>' + P.name + ' ' + pk(cur.product, cur.usd) + '</b></div>'
                + '<div class="row"><span>Voucher price</span><b>' + money(price) + ' ETB</b></div>'
                + '<div class="row"><span>Service fee</span><b>' + money(SERVICE_FEE) + ' ETB</b></div>'
                + '<div class="row total"><span>Total to pay</span><b>' + money(total) + ' ETB</b></div>'
                + '</div></div>';
            if (short > 0) {
                html += '<div class="banner err"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg><div>'
                    + '<b>Not Enough Money in M-PESA</b>Add money at any M-PESA agent, or choose a smaller package.'
                    + '<div class="short"><div><span>Available balance</span><b>' + money(S.wallet) + ' ETB</b></div>'
                    + '<div><span>Required</span><b>' + money(total) + ' ETB</b></div>'
                    + '<div><span>Short by</span><b>' + money(short) + ' ETB</b></div></div></div></div>';
            }
            /* payment and delivery: one card per fact */
            html += '<div class="section"><h2>Payment details</h2></div>'
                + '<div class="fact-card"><span class="ic"><svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M10.5 18.5h3"/></svg></span>'
                + '<span class="t"><b>Payer Phone Number</b><small>' + ME.phone + '</small></span></div>'
                + '<div class="fact-card"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>'
                + '<span class="t"><b>Purchased On ' + fmtDate(new Date()) + '</b><small>Today, when you pay</small></span></div>'
                + '<div style="height:12px"></div>';
            document.getElementById('reviewBody').innerHTML = html;

            const P2 = PRODUCTS[cur.product];
            const lower = P2.denoms.filter(d => d < cur.usd && !P2.unavailable.includes(d) && totalOf(d) <= S.wallet);
            document.getElementById('reviewFoot').innerHTML = short > 0
                ? (lower.length
                    ? '<button class="btn" onclick="pickLower(' + lower[lower.length - 1] + ')">Choose ' + pk(cur.product, lower[lower.length - 1]) + ' instead</button>'
                    : '<button class="btn" onclick="backToHome()">Back to vouchers</button>')
                  + '<button class="btn text" onclick="back()">Change package</button>'
                : '<button class="btn" onclick="toPin()">Pay<svg viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13.5 6.5 6 5.5-6 5.5"/></svg></button>';
        }

        function pickLower(d) { cur.usd = d; renderProduct(); renderReview(); }
        function backToHome() { goTab('stepHome'); }

        /* ================================================================
           PIN (0000 = incorrect, for the demo)
           ================================================================ */
        let pin = '', pinFor = null;   // pinFor = voucher id when the PIN unlocks a code
        function toPin() {
            pin = ''; pinFor = null;
            paintPin();
            document.getElementById('pinErr').textContent = '';
            document.getElementById('pinSum').innerHTML = '<div class="pin-row"><b>VOUCHER</b>' + PRODUCTS[cur.product].name + ' ' + pk(cur.product, cur.usd) + '</div>'
                + '<div class="pin-row"><b>AMOUNT</b>' + money(totalOf(cur.usd)) + ' ETB</div>';
            go('stepPin');
        }
        function paintPin() { document.querySelectorAll('#pinDots .pin-dot').forEach((d, i) => d.classList.toggle('filled', i < pin.length)); }
        function pinPress(d) {
            if (pin.length >= 4) return;
            document.getElementById('pinDots').classList.remove('bad');
            document.getElementById('pinErr').textContent = '';
            pin += d;
            paintPin();
            if (pin.length === 4) setTimeout(checkPin, 180);
        }
        function checkPin() {
            if (pin === '0000') {
                const dots = document.getElementById('pinDots');
                dots.classList.remove('bad'); void dots.offsetWidth; dots.classList.add('bad');
                document.getElementById('pinErr').textContent = 'Incorrect PIN. Please try again.';
                pin = '';
                setTimeout(paintPin, 350);
                return;
            }
            if (pinFor) { const id = pinFor; pinFor = null; pin = ''; revealed[id] = true; back(); return; }
            startPurchase();
        }
        function cancelPin() { pin = ''; pinFor = null; back(); }
        /* the fingerprint stands in for a correct PIN, as in Savings */
        function pinFill() { pin = '1234'; paintPin(); setTimeout(checkPin, 320); }

        /* ================================================================
           Payment -> issuance -> delivery. Each stage shows on its own so a
           failure always names the stage it happened in.
           ================================================================ */
        let purchase = null, procBusy = false;

        /* Run steps one at a time on the overlay. Each step: [title, line, ok?, before].
           A failed step shows a red cross and stops the run. */
        function procRun(steps, then) {
            const overlay = document.getElementById('procOverlay');
            const line = document.getElementById('procLine');
            const text = document.getElementById('procLineText');
            const STEP = 1100;
            procBusy = true;
            overlay.classList.add('show');
            steps.forEach((st, i) => {
                setTimeout(() => {
                    if (st[3]) st[3]();
                    document.getElementById('procOverlayTitle').textContent = st[0];
                    line.classList.add('swap');
                    setTimeout(() => { text.textContent = st[1]; line.classList.remove('done', 'fail', 'swap'); }, 180);
                }, STEP * i);
                setTimeout(() => line.classList.add(st[2] === false ? 'fail' : 'done'), STEP * i + 700);
            });
            setTimeout(() => {
                then();
                overlay.classList.remove('show');
                procBusy = false;
            }, STEP * steps.length + 300);
        }

        function startPurchase() {
            purchase = { product: cur.product, usd: cur.usd, total: totalOf(cur.usd), ref: newRef(), on: new Date().toISOString() };
            const pay = 'Taking ' + whole(purchase.total) + ' ETB from M-PESA';
            if (S.scenario === 'payfail') {
                procRun([['Processing payment', pay, false]], paymentFailed);
                return;
            }
            const paid = ['Processing payment', pay, true, () => { S.wallet -= purchase.total; }];
            if (S.scenario === 'issuefail') {
                procRun([paid,
                    ['Creating your voucher', 'The voucher couldn\u2019t be issued', false],
                    ['Returning your money', 'Refunding ' + whole(purchase.total) + ' ETB to M-PESA', true]], issuanceFailed);
                return;
            }
            procRun([paid,
                ['Creating your voucher', 'Payment received, creating your code', true],
                ['Sending your code', 'By SMS and app notification', true]], voucherReady);
        }

        /* ---------- results ---------- */
        function factsHtml(rows) {
            return '<div class="facts">' + rows.map(r => '<div class="fact"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div>';
        }
        function refRow(ref) { return ['Transaction ID', '<button class="copy-mini" onclick="copyText(\'' + ref + '\', \'Transaction ID copied\')" aria-label="Copy transaction ID"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg></button>' + ref]; }

        function paymentFailed() {
            S.tx.push({ ref: purchase.ref, product: purchase.product, usd: purchase.usd, on: purchase.on, status: 'failed', reason: 'payment' });
            save();
            const P = PRODUCTS[purchase.product];
            document.getElementById('resultTitle').textContent = 'Payment failed';
            document.getElementById('resultBody').innerHTML = '<div class="result">'
                + '<div class="badge err"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></div>'
                + '<h3>Payment Didn’t Go Through</h3>'
                + '<p>Your ' + P.name + ' ' + pk(purchase.product, purchase.usd) + ' voucher wasn’t bought. <b>No money was taken</b> from your M-PESA.</p></div>'
                + factsHtml([['Amount', money(purchase.total) + ' ETB'], ['Status', '<span class="st failed">Not charged</span>'], ['Date', fmtDate(new Date(purchase.on)) + ', ' + fmtTime(new Date(purchase.on))], refRow(purchase.ref)])
                + supportLine();
            document.getElementById('resultFoot').innerHTML = '<button class="btn" onclick="retry()">Try again</button><button class="btn ghost" onclick="backToHome()">Back to vouchers</button>';
            stack = ['stepHome', 'stepResult'];
            show('stepResult');
        }

        function issuanceFailed() {
            S.wallet += purchase.total;      // automatic reversal
            S.tx.push({ ref: purchase.ref, product: purchase.product, usd: purchase.usd, on: purchase.on, status: 'failed', reason: 'issuance' });
            save();
            const P = PRODUCTS[purchase.product], when = new Date(purchase.on);
            document.getElementById('resultTitle').textContent = 'Voucher not issued';
            document.getElementById('resultBody').innerHTML = '<div class="result">'
                + '<div class="badge warn"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/></svg></div>'
                + '<h3>Your Money Has Been Returned</h3>'
                + '<p>We took your payment but couldn’t create your ' + P.name + ' ' + pk(purchase.product, purchase.usd) + ' voucher, so the full <b>' + money(purchase.total) + ' ETB</b> was returned to your M-PESA.</p></div>'
                + '<div class="tl">'
                + '<div class="tl-row g"><i><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></i><span><b>Payment Received</b><small>' + money(purchase.total) + ' ETB &middot; ' + fmtTime(when) + '</small></span></div>'
                + '<div class="tl-row r"><i><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></i><span><b>Voucher Couldn’t Be Issued</b><small>The provider didn’t return a code</small></span></div>'
                + '<div class="tl-row g"><i><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></i><span><b>Refunded to M-PESA</b><small>' + money(purchase.total) + ' ETB &middot; new balance ' + money(S.wallet) + ' ETB</small></span></div>'
                + '</div>'
                + factsHtml([refRow(purchase.ref), ['Date', fmtDate(when) + ', ' + fmtTime(when)]])
                + supportLine();
            document.getElementById('resultFoot').innerHTML = '<button class="btn" onclick="backToHome()">Done</button><button class="btn text" onclick="retry()">Try another value</button>';
            stack = ['stepHome', 'stepResult'];
            show('stepResult');
            notify('M-PESA', 'Your ' + money(purchase.total) + ' ETB for ' + P.name + ' ' + pk(purchase.product, purchase.usd) + ' was refunded. Ref ' + purchase.ref + '.');
        }

        function voucherReady() {
            const smsOk = S.scenario !== 'smsfail';
            const v = { id: 'v' + Date.now(), product: purchase.product, usd: purchase.usd, code: newCode(purchase.product), bought: purchase.on,
                expires: addMonths(new Date(purchase.on), EXPIRY_MONTHS).toISOString(), status: 'active', ref: purchase.ref, sms: smsOk ? 'sent' : 'failed' };
            S.vouchers.unshift(v);
            S.tx.push({ ref: purchase.ref, product: purchase.product, usd: purchase.usd, on: purchase.on, status: 'success', voucher: v.id });
            save();
            paintCount();
            const P = PRODUCTS[v.product];
            document.getElementById('resultTitle').textContent = 'Voucher ready';
            document.getElementById('resultBody').innerHTML = '<div class="result" style="padding-top:0">'
                + '<div class="badge ok" style="width:60px;height:60px;margin-top:4px"><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></div>'
                + '<h3 style="margin-top:12px">Your Voucher Is Ready</h3>'
                + '</div>'
                + ticketHtml(v, true)
                + (smsOk ? '' : '<div class="banner warn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg><div><b>We Couldn’t Send the SMS</b>Your code is safe here and in My Vouchers. <a href="#" onclick="askResend(\'' + v.id + '\');return false;" style="color:inherit;font-weight:700">Resend SMS</a></div></div>')
                + '<button class="redeem-link" onclick="openGuide(\'' + v.product + '\')"><span>How to Redeem<small>' + PRODUCTS[v.product].steps.length + ' quick steps</small></span><span class="info-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 11v5"/><circle cx="12" cy="7.9" r="1.1" class="dot"/></svg></span></button>'
                + factsHtml([refRow(v.ref), ['Paid', money(purchase.total) + ' ETB (incl. ' + SERVICE_FEE + ' ETB fee)']])
                + '<div style="height:12px"></div>';
            document.getElementById('resultFoot').innerHTML = '<button class="btn" onclick="backToHome()">Done</button><button class="btn text" onclick="openVoucher(\'' + v.id + '\', true)">View in My Vouchers</button>';
            stack = ['stepHome', 'stepResult'];
            show('stepResult');
            if (smsOk) setTimeout(() => notify('M-PESA', 'Your ' + P.name + ' ' + pk(v.product, v.usd) + ' voucher code is ' + v.code + '. Ref ' + v.ref + '.'), 500);
        }

        function retry() { renderProduct(); stack = ['stepHome', 'stepProduct']; show('stepProduct'); }
        function resultClose() { backToHome(); }
        function supportLine() {
            return '<p style="margin:16px 24px 0 24px;text-align:center;font-size:13px;color:var(--muted)">Need help? <a href="#" onclick="openHelp();return false;" style="color:var(--green-dark);font-weight:600">Contact M-PESA support</a> with your transaction ID.</p>';
        }

        /* ---------- voucher code component ---------- */
        let revealed = {};
        function ticketHtml(v, open) {
            const P = PRODUCTS[v.product], shown = open || revealed[v.id], live = v.status === 'active';
            return '<div class="ticket"><div class="top">' + mark(v.product)
                + '<span><b>' + P.name + ' ' + pk(v.product, v.usd) + '</b><small>' + P.category + ' voucher</small></span>'
                + '<span class="st ' + v.status + '">' + (v.status === 'redeemed' ? 'used' : v.status) + '</span></div>'
                + '<div class="perf"></div>'
                + '<div class="code"><small>YOUR VOUCHER CODE</small>'
                + '<div class="code-line"><span class="' + (shown ? '' : 'masked') + '">' + (shown ? v.code : maskCode(v.code)) + '</span>'
                + (shown
                    ? '<span class="code-acts"><button onclick="copyText(\'' + v.code + '\', \'Code copied\')"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>COPY CODE</button>' + '<button class="soft" onclick="shareCode(\'' + v.id + '\')"><svg viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></svg>SHARE</button></span>'
                    : '<span class="code-acts"><button onclick="reveal(\'' + v.id + '\')"><svg viewBox="0 0 24 24"><path d="M2.6 12S6.4 5.4 12 5.4 21.4 12 21.4 12 17.6 18.6 12 18.6 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="3"/></svg>VIEW CODE</button></span>')
                + '</div>'
                + '<p class="exp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
                + 'Purchased on <b>' + fmtDate(new Date(v.bought)) + '</b>'
                + '</p></div></div>';
        }
        /* share the code through the phone's share sheet (copies a message where there isn't one) */
        function shareCode(id) {
            const v = S.vouchers.find(x => x.id === id);
            const text = 'My ' + voucherName(v) + ' voucher code: ' + v.code;
            if (navigator.share) { navigator.share({ title: voucherName(v) + ' voucher', text: text }).catch(() => {}); return; }
            copyText(text, 'Code copied to share');
        }

        /* viewing a code asks for the M-PESA PIN first */
        function reveal(id) {
            const v = S.vouchers.find(x => x.id === id);
            pin = ''; pinFor = id;
            paintPin();
            document.getElementById('pinErr').textContent = '';
            document.getElementById('pinSum').innerHTML = '<div class="pin-row"><b>VOUCHER</b>' + voucherName(v) + '</div>'
                + '<div class="pin-row">Enter your PIN to view the code</div>';
            go('stepPin');
        }

        /* ================================================================
           Tab 2 - My Vouchers: what I own
           ================================================================ */
        let mineFilter = 'all';
        function renderMine() {
            const owned = ORDER.filter(p => S.vouchers.some(v => v.product === p));
            document.getElementById('mineChips').innerHTML = S.vouchers.length
                ? ['all'].concat(owned).map(k => '<button class="chip' + (mineFilter === k ? ' on' : '') + '" onclick="setMineFilter(\'' + k + '\')">' + (k === 'all' ? 'All' : PRODUCTS[k].name) + '</button>').join('')
                : '';
            const list = S.vouchers.filter(v => mineFilter === 'all' || v.product === mineFilter);
            const item = v => '<button class="item' + (v.status === 'active' ? '' : ' dim') + '" onclick="openVoucher(\'' + v.id + '\')">' + mark(v.product)
                + '<span class="t"><b>' + voucherName(v) + '</b>'
                + '<small>' + 'Purchased on ' + fmtDate(new Date(v.bought)) + '</small></span>'
                + '<span class="r"><span class="st ' + v.status + '">' + (v.status === 'redeemed' ? 'used' : v.status) + '</span></span></button>';
            const active = list.filter(v => v.status === 'active'), past = list.filter(v => v.status !== 'active');
            document.getElementById('mineBody').innerHTML = !S.vouchers.length
                ? emptyHtml('<path d="M3.5 7.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1V10a2 2 0 0 0 0 4v2.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V14a2 2 0 0 0 0-4V7.5Z"/><path d="M14 6.5v11" stroke-dasharray="2 2"/>',
                    'No Vouchers Yet', 'Vouchers you buy are kept here, with their codes and purchase dates.', '<button class="btn" onclick="backToHome()">Browse vouchers</button>')
                : (active.length ? '<p class="list-head">Ready to use</p><div class="group-card">' + active.map(item).join('') + '</div>' : '')
                  + (past.length ? '<p class="list-head" style="margin-top:16px">Used codes</p><div class="group-card">' + past.map(item).join('') + '</div>' : '')
                  + '<div style="height:12px"></div>';
            paintCount();
        }
        function setMineFilter(k) { mineFilter = k; renderMine(); }

        /* ---------- voucher details ---------- */
        let curVoucher = null;
        function openVoucher(id, fromResult) {
            curVoucher = id;
            if (fromResult) { revealed[id] = true; stack = ['stepMine', 'stepVoucher']; renderVoucher(); show('stepVoucher'); return; }
            delete revealed[id];
            renderVoucher();
            go('stepVoucher');
        }
        function renderVoucher() {
            const v = S.vouchers.find(x => x.id === curVoucher);
            if (!v) return;
            const tx = S.tx.find(t => t.ref === v.ref);
            document.getElementById('voucherBody').innerHTML = ticketHtml(v, false)
                + (v.sms === 'failed' && v.status === 'active' ? '<div class="banner warn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg><div><b>SMS Not Delivered</b>Your code is safe here. You can resend it by SMS below.</div></div>' : '')
                + '<button class="redeem-link" onclick="openGuide(\'' + v.product + '\')"><span>How to Redeem<small>' + PRODUCTS[v.product].steps.length + ' quick steps</small></span><span class="info-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 11v5"/><circle cx="12" cy="7.9" r="1.1" class="dot"/></svg></span></button>'
                + factsHtml([['Voucher type', voucherName(v)], ['Paid', money(totalOf(v.usd)) + ' ETB'], ['Purchased on', fmtDate(new Date(v.bought)) + ', ' + fmtTime(new Date(v.bought))], refRow(v.ref)])
                + (tx ? '<p style="margin:12px 16px 0 16px;text-align:center"><a href="#" onclick="openTx(\'' + tx.ref + '\');return false;" style="font-size:13px;color:var(--green-dark);font-weight:600">View payment details</a></p>' : '')
                + '<div style="height:12px"></div>';
            document.getElementById('voucherFoot').innerHTML = v.status === 'active'
                ? '<button class="btn ghost" onclick="askResend(\'' + v.id + '\')"><svg viewBox="0 0 24 24" style="stroke:currentColor"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5v-3.5h-1a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/></svg>Resend SMS</button>'
                : '<button class="btn ghost" onclick="openProduct(\'' + v.product + '\')">Buy another ' + PRODUCTS[v.product].name + ' voucher</button>';
        }

        /* ---------- resend SMS: confirm -> sending -> sent / failed ---------- */
        let resendTries = 0;
        function askResend(id) {
            const v = S.vouchers.find(x => x.id === id);
            document.getElementById('sheetBody').innerHTML = '<div class="grab"></div><h3>Resend Voucher SMS?</h3>'
                + '<p>We’ll send the code for your <b>' + voucherName(v) + '</b> voucher to <b>' + ME.phone + '</b>, your M-PESA number.</p>'
                + '<div class="acts"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" id="resendGo" onclick="doResend(\'' + id + '\')">Resend</button></div>';
            document.getElementById('sheet').classList.add('show');
        }
        function doResend(id) {
            const btn = document.getElementById('resendGo');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span>Sending';
            setTimeout(() => {
                const v = S.vouchers.find(x => x.id === id);
                /* the SMS-failure demo fails the first resend too, to show the retry */
                const fail = S.scenario === 'smsfail' && resendTries === 0;
                resendTries++;
                if (fail) {
                    document.getElementById('sheetBody').innerHTML = '<div class="grab"></div><h3>SMS Couldn’t Be Sent</h3>'
                        + '<p>The network didn’t accept the message. Your code is still safe in My Vouchers.</p>'
                        + '<div class="acts"><button class="btn ghost" onclick="closeSheet()">Close</button><button class="btn" id="resendGo" onclick="doResend(\'' + id + '\')">Try again</button></div>';
                    return;
                }
                v.sms = 'sent';
                save();
                closeSheet();
                if (document.getElementById('stepVoucher').classList.contains('active')) renderVoucher();
                showToast('SMS sent to ' + ME.phone);
                setTimeout(() => notify('SMS', 'Your ' + voucherName(v) + ' voucher code is ' + v.code + '.'), 400);
            }, 1300);
        }

        /* ================================================================
           Tab 3 - Transactions: what I paid for (no codes here)
           ================================================================ */
        let txFilter = 'all';
        function setTxFilter(f) {
            txFilter = f;
            document.querySelectorAll('#txSeg button').forEach((b, i) => b.classList.toggle('on', ['all', 'success', 'failed'][i] === f));
            renderTx();
        }
        function txStatus(t) {
            if (t.status === 'success') return ['success', 'Successful'];
            if (t.reason === 'issuance') return ['refunded', 'Refunded'];
            return ['failed', 'Failed'];
        }
        function renderTx() {
            const list = S.tx.slice().sort((a, b) => new Date(b.on) - new Date(a.on))
                .filter(t => txFilter === 'all' || (txFilter === 'success' ? t.status === 'success' : t.status !== 'success'));
            const month = d => d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
            const months = [];
            list.forEach(t => {
                const m = month(new Date(t.on)), g = months[months.length - 1];
                if (g && g.m === m) g.rows.push(t); else months.push({ m: m, rows: [t] });
            });
            const row = t => {
                    const d = new Date(t.on);
                    const s = txStatus(t);
                    return '<button class="item" onclick="openTx(\'' + t.ref + '\')">' + mark(t.product)
                        + '<span class="t"><b>' + PRODUCTS[t.product].name + ' ' + pk(t.product, t.usd) + '</b><small>' + fmtDate(d) + ', ' + fmtTime(d) + '</small></span>'
                        + '<span class="r"><b>' + (t.status === 'success' ? '-' : '') + whole(totalOf(t.usd)) + ' ETB</b><span class="st ' + s[0] + '">' + s[1] + '</span></span></button>';
                };
            document.getElementById('txBody').innerHTML = list.length
                ? months.map((g, i) => '<p class="list-head"' + (i ? ' style="margin-top:16px"' : '') + '>' + g.m + '</p>'
                    + '<div class="group-card">' + g.rows.map(row).join('') + '</div>').join('') + '<div style="height:12px"></div>'
                : (S.tx.length
                    ? emptyHtml('<path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4v-17Z"/><path d="M9 8.5h6M9 12h6"/>', txFilter === 'failed' ? 'No failed payments' : 'No Successful Payments', 'Nothing matches this filter.', '')
                    : emptyHtml('<path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4v-17Z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>', 'No Transactions Yet', 'Your voucher payments will show here.', '<button class="btn" onclick="backToHome()">Browse vouchers</button>'));
        }

        function openTx(ref) {
            const t = S.tx.find(x => x.ref === ref);
            const d = new Date(t.on), s = txStatus(t), P = PRODUCTS[t.product];
            const head = t.status === 'success'
                ? ['ok', '<path d="m6 12.5 4 4 8-9"/>', 'Payment Successful', 'Your voucher was issued.']
                : t.reason === 'issuance'
                    ? ['warn', '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5V9h4.5"/>', 'Refunded', 'The voucher couldn’t be issued, so your payment was returned in full.']
                    : ['err', '<path d="M7 7l10 10M17 7 7 17"/>', 'Payment Failed', 'The payment didn’t go through. No money was taken.'];
            document.getElementById('txDetailBody').innerHTML = '<div class="result"><div class="badge ' + head[0] + '"><svg viewBox="0 0 24 24">' + head[1] + '</svg></div>'
                + '<h3>' + head[2] + '</h3><p>' + head[3] + '</p></div>'
                + '<div class="card" style="margin-top:18px"><div class="v-sum">' + mark(t.product) + '<span><b>' + P.name + ' Voucher</b><small>' + pk(t.product, t.usd) + ' package</small></span></div>'
                + '<div class="rows"><div class="row"><span>Voucher price</span><b>' + money(priceOf(t.usd)) + ' ETB</b></div>'
                + '<div class="row"><span>Service fee</span><b>' + money(SERVICE_FEE) + ' ETB</b></div>'
                + '<div class="row total"><span>' + (t.status === 'success' ? 'Total paid' : t.reason === 'issuance' ? 'Paid, then refunded' : 'Total (not charged)') + '</span><b>' + money(totalOf(t.usd)) + ' ETB</b></div></div></div>'
                + factsHtml([['Status', '<span class="st ' + s[0] + '">' + s[1] + '</span>'], ['Date', fmtDate(d) + ', ' + fmtTime(d)], ['Paid from', 'M-PESA &middot; ' + ME.phone], refRow(t.ref)]
                    .concat(t.reason === 'issuance' ? [['Refund', money(totalOf(t.usd)) + ' ETB returned']] : []))
                + (t.status === 'success' ? '' : supportLine())
                + '<div style="height:12px"></div>';
            document.getElementById('txDetailFoot').innerHTML = t.status === 'success' && t.voucher && S.vouchers.some(v => v.id === t.voucher)
                ? '<button class="btn ghost" onclick="openVoucher(\'' + t.voucher + '\')">View voucher</button>'
                : t.status === 'success' ? '' : '<button class="btn" onclick="openProduct(\'' + t.product + '\')">Try again</button>';
            go('stepTxDetail');
        }

        /* ================================================================
           Help (from the ? in the header)
           ================================================================ */
        function openHelp() {
            const faq = (q, a) => '<details class="faq"><summary>' + q + '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary><p>' + a + '</p></details>';
            document.getElementById('helpBody').innerHTML = '<p class="p-desc" style="margin-top:4px">Global Vouchers is an official M-PESA service. Buy vouchers for global apps and games with your M-PESA wallet, and get your code straight away.</p>'
                + '<div class="section"><h2>How to redeem</h2></div>'
                + ORDER.map(k => '<details class="fold" style="margin-bottom:8px"><summary><span style="display:flex;align-items:center;gap:10px">' + mark(k, 30) + PRODUCTS[k].name + '</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>' + guideHtml(k) + '</details>').join('')
                + '<div class="section"><h2>Common questions</h2></div>'
                + faq('Where can I find my voucher code?', 'On screen right after you pay, in the SMS we send to your M-PESA number, and any time in My Vouchers.')
                + faq('Money was taken but I got no voucher', 'If a voucher can’t be issued after you pay, the full amount is returned to your M-PESA automatically. You’ll see it as Refunded in Transactions.')
                + faq('I didn’t get the SMS', 'Open the voucher in My Vouchers and tap Resend SMS. Your code is always kept there.')
                + faq('What do the fees cover?', 'Each voucher has a fixed service fee, shown on the review screen before you pay.')
                + '<div class="section"><h2>Contact us</h2></div>'
                + '<button class="contact" onclick="showToast(\'Calling M-PESA Call Center\')"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4.5h3.5l1.5 4-2 1.3a10 10 0 0 0 6.2 6.2l1.3-2 4 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 6.1 1.5 1.5 0 0 1 5 4.5Z"/></svg></span><span><b>M-PESA Call Center</b><small>Have your transaction ID ready</small></span></button>'
                + '<button class="contact" onclick="showToast(\'Opening email\')"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><span><b>Email Support</b><small>Replies within one working day</small></span></button>'
                + '<div style="height:16px"></div>';
            go('stepHelp');
        }

        /* ================================================================
           Shared bits
           ================================================================ */
        function emptyHtml(icon, title, text, action) {
            return '<div class="empty"><span class="art"><svg viewBox="0 0 24 24">' + icon + '</svg></span><b>' + title + '</b><p>' + text + '</p>' + action + '</div>';
        }
        function copyText(text, msg) {
            try { navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
            showToast(msg);
        }
        function closeSheet() { document.getElementById('sheet').classList.remove('show'); }

        let noticeTimer;
        function notify(from, text) {
            document.getElementById('noticeFrom').textContent = from;
            document.getElementById('noticeText').textContent = text;
            document.getElementById('notice').classList.add('show');
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(hideNotice, 6000);
        }
        function hideNotice() { document.getElementById('notice').classList.remove('show'); }

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        /* ---------- Start ---------- */
        renderHome();
        note('stepHome');
        /* the catalogue and availability come from the provider: a short loading state */
        setTimeout(() => { catalogueReady = true; if (document.getElementById('stepHome').classList.contains('active')) renderHome(); }, 700);
        const openTab = START.get('tab');
        if (openTab === 'mine') goTab('stepMine');
        if (openTab === 'tx') goTab('stepTx');
    </script>
</body>
</html>
