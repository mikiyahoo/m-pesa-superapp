<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fayda Linking Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 360px;
            height: 808px; /* 760px screen + 48px system nav */
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 4px 16px;
            flex-shrink: 0;
        }

        .status-bar .time {
            font-size: 13px;
            font-weight: 600;
            color: #333333;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666666;
        }

        .status-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            display: block;
        }

        /* ---------- App bar ---------- */
        .app-bar {
            display: flex;
            align-items: center;
            padding: 10px 16px 6px 16px;
            flex-shrink: 0;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            border-radius: 50%;
        }

        .close-btn:active { background-color: #f2f2f2; }

        .close-btn svg {
            width: 22px;
            height: 22px;
            stroke: #444444;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
        }

        /* ---------- Error body ---------- */
        .error-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 28px 0 28px;
            text-align: center;
        }

        .error-body h2 {
            font-size: 26px;
            font-weight: 300;
            color: #3c3c3c;
            letter-spacing: 1px;
            line-height: 1.25;
        }

        .phone-art {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-art svg { width: 92px; height: 150px; display: block; }

        .error-body .msg {
            font-size: 14px;
            font-weight: 500;
            color: #4a4a4a;
            line-height: 1.5;
            max-width: 280px;
        }

        .reason {
            margin-top: 14px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            background: #FDECEC;
            color: #9C1B2B;
            font-size: 13px;
            line-height: 1.45;
            text-align: left;
        }

        .reason b { display: block; font-weight: 700; margin-bottom: 2px; }
        .reason small { display: block; margin-top: 4px; color: #b45b66; font-size: 11.5px; letter-spacing: 0.3px; }

        .support {
            margin-top: 12px;
            font-size: 12.5px;
            color: #7a7f7c;
            line-height: 1.45;
            max-width: 290px;
        }

        .support a { color: #2FC56D; font-weight: 700; text-decoration: none; }

        /* ---------- Action ---------- */
        .action {
            padding: 18px 14px 18px 14px;
            flex-shrink: 0;
        }

        .ghost-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: #ffffff;
            color: #3c3c3c;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s ease;
        }

        .ghost-btn:active { transform: scale(0.99); }
        .ghost-btn:disabled { color: #b0b0b0; cursor: default; }

        /* ---------- Retry overlay ---------- */
        .busy {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.94);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 5;
        }

        .busy.show { display: flex; }
        .busy p { font-size: 15px; font-weight: 600; color: #3c3c3c; }

        .spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid #E2F6EA;
            border-top-color: #2FC56D;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Android system navigation ---------- */
        .system-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            height: 48px;
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            color: #666666;
        }

        .system-nav svg { width: 19px; height: 19px; display: block; }
    </style>
    <script src="assets/prototype-mode.js?v=67"></script>
</head>
<body>

    <div class="mobile-container">

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:00</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71L13.41 12l4.3-4.29ZM13 5.83l1.88 1.88L13 9.59V5.83Zm1.88 10.46L13 18.17v-3.76l1.88 1.88Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.1 8.9a14.2 14.2 0 0 1 19.8 0L12.9 20.3a1.1 1.1 0 0 1-1.8 0L2.1 8.9Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.9 3.6v16.1c0 .5-.4.9-.9.9H4.6c-.8 0-1.2-1-.6-1.5L19.4 3c.6-.6 1.5-.2 1.5.6Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.6 1.8h4.8c.5 0 .9.4.9.9v1.1H8.7V2.7c0-.5.4-.9.9-.9Z"/>
                    <rect x="6.6" y="4.3" width="10.8" height="17.9" rx="2.2"/>
                </svg>
            </div>
        </div>

        <!-- App bar -->
        <div class="app-bar">
            <button class="close-btn" onclick="goBackToApp()" aria-label="Close">
                <svg viewBox="0 0 24 24"><path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"/></svg>
            </button>
        </div>

        <!-- Error -->
        <div class="error-body">
            <h2 id="errTitle"></h2>

            <!-- red phone with a clock -->
            <div class="phone-art">
                <svg viewBox="0 0 92 150" aria-hidden="true">
                    <rect x="4" y="4" width="84" height="142" rx="11" fill="#D7263D"/>
                    <rect x="10" y="16" width="72" height="118" rx="4" fill="#E8434F"/>
                    <rect x="36" y="8" width="20" height="3" rx="1.5" fill="#9C1B2B"/>
                    <circle cx="46" cy="140" r="3" fill="#9C1B2B"/>
                    <circle cx="46" cy="74" r="17" fill="none" stroke="#5A0F18" stroke-width="3.2"/>
                    <path d="M46 64v11l7 5" fill="none" stroke="#5A0F18" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <p class="msg" id="errMsg"></p>
            <div class="reason" id="errReason" hidden></div>
            <p class="support" id="errSupport" hidden></p>
        </div>

        <!-- Action -->
        <div class="action">
            <button class="ghost-btn" id="errBtn"></button>
        </div>

        <!-- Retrying -->
        <div class="busy" id="busy">
            <div class="spinner"></div>
            <p>Retrying your request...</p>
        </div>

        <!-- Android System Navigation -->
        <div class="system-nav">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14.8 4.8 6 12l8.8 7.2V4.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="6.9" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5.4" y="5.4" width="13.2" height="13.2" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>
    </div>

    <script>
        /* Fayda linking error screens:
             ?type=limit   the phone number already has the maximum number of linked accounts
             ?type=failed  the final activation step failed (reason taken from the backend) */
        const TYPE = new URLSearchParams(location.search).get('type') === 'limit' ? 'limit' : 'failed';

        /* sample backend response for the failure; the real reason and code come from the API */
        const BACKEND_FAILURE = {
            code: 'FYD-ACT-503',
            reason: 'The Fayda service did not respond while activating the link.'
        };

        const NOTES = {
            limit: 'Shown when the backend reports that this phone number has reached the maximum allowed number of Fayda account linkings (checked after OTP verification, before consent). Inform the customer that no additional accounts can be linked to this phone number. No retry: the only action is CLOSE, back to where the Fayda journey started.',
            failed: 'Shown when Fayda linking fails at the final activation stage (after CONFIRM on the profile). Display the actual failure reason and code from the backend response, not a generic message. RETRY resubmits the same activation request without asking for FAN / OTP again; if it keeps failing, the customer is guided to contact customer care. In this prototype the retry succeeds.'
        };

        function render() {
            const limit = TYPE === 'limit';
            document.title = limit ? 'Limit Reached' : 'Request Failed';
            document.getElementById('errTitle').innerHTML = limit ? 'LIMIT<br>REACHED' : 'REQUEST<br>FAILED';
            document.getElementById('errMsg').textContent = limit
                ? 'This phone number has reached the maximum number of accounts that can be linked with Fayda. No additional accounts can be linked to this phone number.'
                : 'We are unable to complete linking your account with Fayda. Please try again.';

            const reason = document.getElementById('errReason');
            reason.hidden = limit;
            if (!limit) {
                reason.innerHTML = '<b>Reason</b>' + BACKEND_FAILURE.reason + '<small>Error code: ' + BACKEND_FAILURE.code + '</small>';
            }

            const support = document.getElementById('errSupport');
            support.hidden = limit;
            if (!limit) support.innerHTML = 'If this keeps happening, <a href="#" onclick="return false">contact M-PESA customer care</a> and share the error code.';

            const btn = document.getElementById('errBtn');
            btn.textContent = limit ? 'CLOSE' : 'RETRY';
            btn.onclick = limit ? goBackToApp : retry;

            if (window.prototypeMode && window.prototypeMode.devNote) window.prototypeMode.devNote(NOTES[TYPE]);
        }

        /* resubmit the activation; the prototype's retry goes through */
        function retry() {
            document.getElementById('errBtn').disabled = true;
            document.getElementById('busy').classList.add('show');
            try { sessionStorage.removeItem('faydaError'); } catch (e) {}
            setTimeout(() => { window.location.href = 'Request Submitted.html'; }, 1600);
        }

        function goBackToApp() {
            var target = 'Send to Bank.html';
            try { target = sessionStorage.getItem('faydaReturn') || target; } catch (e) {}
            window.location.href = target;
        }

        render();
    </script>

</body>
</html>
