<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-PESA App Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 360px;
            height: 808px; /* 760px screen + 48px system nav */
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 4px 16px;
            flex-shrink: 0;
            background: #ffffff;
        }

        .status-bar .time {
            font-size: 13px;
            font-weight: 600;
            color: #333333;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333333;
        }

        .status-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            display: block;
        }

        /* ---------- Scroll ---------- */
        .scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 76px; /* the last card can scroll clear of the QR button */
        }

        .scroll::-webkit-scrollbar { display: none; }

        /* ---------- Green header ---------- */
        .header {
            flex-shrink: 0;
            background: linear-gradient(180deg, #0E7A38 0%, #26A652 52%, #43CB74 100%);
            padding: 28px 16px 20px 16px;
            color: #ffffff;
        }

        .greeting {
            display: flex;
            align-items: center;
            margin-bottom: 22px;
        }

        .greeting img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .greeting .hello {
            flex-grow: 1;
            min-width: 0;
        }

        .greeting .hello small {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.1;
        }

        .greeting .hello strong {
            display: block;
            font-size: 22px;
            font-weight: 500;   /* medium, not bold */
            color: #ffffff;
            line-height: 1.2;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .header-actions svg {
            width: 23px;
            height: 23px;
            stroke: #ffffff;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            /* narrow phones: the chips scroll sideways instead of spilling */
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }
        .tabs .tab { flex-shrink: 0; }

        .tab {
            height: 33px;
            padding: 0 11px;
            border: none;
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-family: 'Barlow', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.15s ease;
            white-space: nowrap;
        }

        .tab.active {
            background: #ffffff;
            color: #128A3F;
        }

        /* balance */
        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .balance-label span {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.8px;
        }

        .balance-label button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .balance-label svg {
            width: 21px;
            height: 21px;
            stroke: #ffffff;
            stroke-width: 1.7;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
        }

        /* the unit here is as big as the number beside it */
        .balance-extra .cur { font-size: inherit; }

        .balance-extra {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* quick actions */
        .quick {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* solid dark green tiles, a full tone below the header */
        .quick button {
            background: #0B7A43;
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            padding: 10px 8px 10px 8px;
            cursor: pointer;
            font-family: 'Barlow', sans-serif;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 84px;
            transition: background 0.15s ease;
        }

        .quick button:active { background: #096A3A; }

        .quick .ic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: 0;
        }

        .quick .ic svg { width: 17px; height: 17px; }

        .quick .lbl {
            font-size: 12.5px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        /* ---------- Suggested for you ---------- */
        .suggest-label {
            margin: 0 16px 10px 16px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #5f5f5f;
        }

        .suggest {
            display: flex;
            gap: 10px;
            padding: 0 16px 24px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .suggest::-webkit-scrollbar { display: none; }

        .ad {
            position: relative;
            flex: 0 0 auto;
            width: 110px;
            aspect-ratio: 104 / 156;
            border: none;
            padding: 0;
            border-radius: 10px;
            overflow: hidden;
            background: #1c1c1c;
            cursor: pointer;
        }

        .ad img.art { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* the "for you" mark: a red circle holding a person */
        .ad .for-you {
            position: absolute;
            top: 7px;
            left: 7px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #E4002B;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad .for-you svg { width: 15px; height: 15px; display: block; }

        /* drawn banner ads: picture on top, a line of copy at the foot */
        .ad .copy { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 9px 9px 9px; text-align: left; font-family: 'Barlow', sans-serif; font-size: 10.5px; line-height: 1.25; color: rgba(255,255,255,0.9); background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.72) 55%); }
        .ad .copy b { display: block; font-size: 12.5px; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
        .ad-gv { background: radial-gradient(120% 80% at 100% 0%, #22B262 0%, rgba(34,178,98,0) 60%), linear-gradient(170deg, #0A5A31 0%, #0d2a1a 100%); }
        .ad-gv .gv-stack { position: absolute; left: 0; right: 0; top: 30px; height: 80px; }
        .ad-gv .c { position: absolute; width: 66px; height: 42px; border-radius: 7px; padding: 6px 7px; font-family: 'Barlow', sans-serif; font-size: 9px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: flex-start; gap: 3px; box-shadow: 0 6px 12px rgba(0,0,0,0.35); }
        .ad-gv .c-sp { right: 8px; top: 0; transform: rotate(12deg); background: radial-gradient(120% 100% at 100% 0%, rgba(29,185,84,0.6), rgba(29,185,84,0) 60%), #151515; color: #ffffff; }
        .ad-gv .c-sp i { width: 9px; height: 9px; border-radius: 50%; background: #1DB954; flex-shrink: 0; }
        .ad-gv .c-pb { right: 20px; top: 18px; transform: rotate(-3deg); background: radial-gradient(120% 100% at 100% 0%, rgba(242,169,0,0.65), rgba(242,169,0,0) 60%), #1b1c1f; color: #F2A900; }
        .ad-gv .c-nf { right: 30px; top: 36px; transform: rotate(-14deg); background: radial-gradient(120% 100% at 100% 0%, #9B0B14, rgba(155,11,20,0) 62%), #0b0b0b; color: #E50914; }

        /* ---------- Frequents and transactions ---------- */
        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 16px 12px 16px;
        }

        .sec-head h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #5f5f5f;
        }

        .sec-head button {
            border: none;
            background: none;
            padding: 0;
            font-family: 'Barlow', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #2BAF57;
            cursor: pointer;
        }

        .frequents {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin: 0 12px 26px 12px;
        }

        .frequents button {
            border: none;
            background: none;
            padding: 0;
            font-family: 'Barlow', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 0;
        }

        .frequents img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }

        .frequents img.logo { object-fit: contain; }

        .frequents b {
            font-size: 12.5px;
            font-weight: 500;
            color: #2a2a2a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .frequents small { font-size: 11px; color: #9a9a9a; margin-top: 1px; }

        .txn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .txn img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .txn .who { flex: 1; min-width: 0; }
        .txn .who b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: 0.4px; color: #4a4a4a; }
        .txn .who small { display: block; margin-top: 2px; font-size: 12px; color: #9a9a9a; }
        .txn .amt { text-align: right; }
        .txn .amt b { display: block; font-size: 13.5px; font-weight: 600; color: #4a4a4a; }
        .txn .amt small { display: block; margin-top: 2px; font-size: 12px; color: #9a9a9a; }


        /* ---------- Reward banner ---------- */
        .reward {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 16px 24px 16px;
            padding: 12px 14px;
            border-radius: 8px;
            background: linear-gradient(100deg, #EE9A0C 0%, #F0A81C 55%, #E98C06 100%);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .reward .badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 2;
        }

        .reward .badge svg { width: 24px; height: 24px; }

        .reward .copy { flex-grow: 1; min-width: 0; z-index: 2; }

        .reward .copy small {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
        }

        .reward .copy strong {
            display: block;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .reward .explore {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 7px 14px;
            font-family: 'Barlow', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #E08700;
            cursor: pointer;
            flex-shrink: 0;
            z-index: 2;
        }

        .reward .explore svg { width: 14px; height: 14px; }

        .reward .trophy {
            position: absolute;
            right: 2px;
            bottom: -6px;
            width: 82px;
            height: auto;
            z-index: 1;
        }

        /* ---------- QR floating button ---------- */
        .fab {
            position: absolute;
            right: 16px;
            bottom: 128px; /* clears the app nav (62px) + system nav (48px) */
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #1A73E8;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(26, 115, 232, 0.4);
            z-index: 15;
        }

        .fab svg { width: 28px; height: 28px; }

        /* ---------- Bottom navigation ---------- */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            padding: 8px 0 10px 0;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #AAAAAA;
            padding: 2px 0;
        }

        .nav-item svg { width: 22px; height: 22px; }

        .nav-item img {
            width: 26px;
            height: 22px;
            object-fit: contain;
            opacity: 0.45;
            filter: grayscale(1);
        }

        .nav-item.active { color: #2BAF57; }

        .nav-item.active img { opacity: 1; filter: none; }

        /* ---------- Android system navigation ---------- */
        .system-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            height: 48px;
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            color: #666666;
        }

        .system-nav svg { width: 19px; height: 19px; display: block; }

        /* ---------- Toast ---------- */
        .toast {
            position: absolute;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(9, 126, 70, 0.95);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 10px 16px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .masked { letter-spacing: 3px; }

        /* ---------- Banner ad story ---------- */
        .story { position: absolute; left: 0; right: 0; top: 0; bottom: 48px; z-index: 60; overflow: hidden; background: #ffffff; opacity: 0; visibility: hidden; transform: scale(0.96); transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s; }
        .story.show { opacity: 1; visibility: visible; transform: none; }
        .story-bars { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 5px; z-index: 3; }
        .story-bars span { flex: 1; height: 3px; border-radius: 2px; background: rgba(140, 140, 140, 0.4); overflow: hidden; }
        .story-bars i { display: block; height: 100%; width: 0; background: #ffffff; }
        .story.light .story-bars i { background: #1c1c1c; }
        .story-x { position: absolute; top: 28px; right: 12px; width: 40px; height: 40px; border: 0; background: none; z-index: 4; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .story-x svg { width: 24px; height: 24px; stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; }
        .story.light .story-x svg { stroke: #1c1c1c; }
        .story-slide { position: absolute; inset: 0; display: flex; flex-direction: column; }
        .story-slide .txt { padding: 92px 24px 0 24px; text-align: center; position: relative; z-index: 2; animation: storyIn 0.35s ease; }
        .story-slide h2 { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-size: 44px; font-weight: 800; line-height: 0.95; letter-spacing: -0.3px; text-transform: uppercase; }
        .story-slide p { margin-top: 16px; font-size: 16px; line-height: 1.35; }
        .story-slide .pic { position: relative; flex: 1; min-height: 0; margin-top: 18px; }
        .story-slide .pic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .story-slide .pic .fade { position: absolute; left: 0; right: 0; top: 0; height: 90px; }
        @keyframes storyIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .story-tap { position: absolute; top: 60px; bottom: 110px; border: 0; background: none; z-index: 2; cursor: pointer; }
        .story-tap.prev { left: 0; width: 33%; }
        .story-tap.next { right: 0; width: 67%; }
        .story-cta { position: absolute; left: 24px; right: 24px; bottom: 24px; height: 56px; border: 0; border-radius: 28px; background: #2FC56D; color: #ffffff; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 600; z-index: 4; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
        .story-cta:active { transform: scale(0.98); }
    </style>
    <script src="assets/prototype-mode.js?v=66"></script>
</head>
<body>

    <div class="mobile-container">

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:00</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71L13.41 12l4.3-4.29ZM13 5.83l1.88 1.88L13 9.59V5.83Zm1.88 10.46L13 18.17v-3.76l1.88 1.88Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.1 8.9a14.2 14.2 0 0 1 19.8 0L12.9 20.3a1.1 1.1 0 0 1-1.8 0L2.1 8.9Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.9 3.6v16.1c0 .5-.4.9-.9.9H4.6c-.8 0-1.2-1-.6-1.5L19.4 3c.6-.6 1.5-.2 1.5.6Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9.6 1.8h4.8c.5 0 .9.4.9.9v1.1H8.7V2.7c0-.5.4-.9.9-.9Z"/>
                    <rect x="6.6" y="4.3" width="10.8" height="17.9" rx="2.2"/>
                </svg>
            </div>
        </div>

        <!-- Green header: stays put while the rest scrolls -->
        <div class="header">

                <div class="greeting">
                    <img src="assets/avatars/avatar-2.png" alt="">
                    <div class="hello">
                        <small>Hello,</small>
                        <strong>Mikias!</strong>
                    </div>
                    <div class="header-actions">
                        <button onclick="showToast('NOTIFICATIONS')" aria-label="Notifications">
                            <svg viewBox="0 0 24 24">
                                <path d="M18 8.6a6 6 0 1 0-12 0c0 6-2.4 7.4-2.4 7.4h16.8S18 14.6 18 8.6Z"/>
                                <path d="M13.7 19.6a2 2 0 0 1-3.4 0"/>
                            </svg>
                        </button>
                        <button onclick="showToast('INSIGHTS')" aria-label="Insights">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 20V13M9 20v-5M14 20v-9M19 20V9"/>
                                <path d="M4 8.8 10 4.6l4.4 3.2L21 3"/>
                                <path d="M17.2 2.8H21v3.8"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="setTab(this)">M-PESA</button>
                    <button class="tab" onclick="setTab(this)">AIRTIME</button>
                    <button class="tab" onclick="setTab(this)">INTERNET</button>
                    <button class="tab" onclick="setTab(this)">VOICE</button>
                </div>

                <!-- Balance -->
                <div class="balance-label">
                    <span>M-PESA BALANCE</span>
                    <button onclick="toggleBalance()" aria-label="Hide balance">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M2.6 12S6.4 5.4 12 5.4 21.4 12 21.4 12 17.6 18.6 12 18.6 2.6 12 2.6 12Z"/>
                            <circle cx="12" cy="12" r="3.1"/>
                            <path id="eyeSlash" d="M4 20 20 4"/>
                        </svg>
                    </button>
                </div>

                <p class="balance-amount" id="balanceAmount">5,000 ETB</p>
                <p class="balance-extra" id="balanceExtra">Eriff Balance: 500 ETB</p>

                <!-- Quick actions -->
                <div class="quick">
                    <button onclick="showToast('SEND MONEY')">
                        <span class="ic">
                            <svg viewBox="0 0 24 24" fill="none">
                                <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3.4 18.2 10 4.6"/>
                                    <path d="M6.6 6.3 10 4.6l.8 3.7"/>
                                    <path d="M20.6 5.8 14 19.4"/>
                                    <path d="M17.4 17.7 14 19.4l-.8-3.7"/>

    <script>
        /* ---------- Tabs ---------- */
        function setTab(btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            showToast(btn.textContent.trim());
        }

        /* ---------- Balance ---------- */
        let visible = true;
        function toggleBalance() {
            visible = !visible;
            const amount = document.getElementById('balanceAmount');
            const extra = document.getElementById('balanceExtra');
            const slash = document.getElementById('eyeSlash');

            if (visible) {
                amount.textContent = '5,000 ETB';
                extra.textContent = 'Eriff Balance: 500 ETB';
                amount.classList.remove('masked');
                slash.style.display = '';
            } else {
                amount.textContent = '*****';
                extra.textContent = 'Eriff Balance: *****';
                amount.classList.add('masked');
                slash.style.display = 'none';
            }
        }

        /* ---------- Toast ---------- */
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        /* ---------- Banner ad story ----------
           Each ad opens a short story: slides advance on their own (5 s),
           tap right for next, left for previous, press and hold to pause. */
        const STORIES = {
            vouchers: {
                cta: 'Buy a voucher', go: 'Global Vouchers.html',
                slides: [
                    { title: 'Netflix nights, paid with M-PESA', text: 'Buy a Netflix voucher in seconds and watch your favorite shows.', img: 'assets/NETFLIX.jpg', fit: 'cover', bg: '#000000' },
                    { title: 'Endless music on Spotify', text: 'Pay for Spotify Premium with a voucher, straight from your wallet.', img: 'assets/SPOTIFY.jpg', fit: 'cover', bg: '#0b0b0b' },
                    { title: 'Level up in PUBG Mobile', text: 'Top up UC for skins, outfits and more. Your code arrives by SMS.', img: 'assets/PUGB.jpg', fit: 'cover', bg: '#0f2033' }
                ]
            },
            saving: {
                cta: 'Start saving', go: 'Savings.html',
                slides: [
                    { title: 'Save and earn every day', text: 'Grow your money with up to 10% a year, right in M-PESA.', img: 'assets/savings-optin1.jpg', fit: 'contain', bg: '#ffffff', light: true },
                    { title: 'A pocket for every goal', text: 'School, travel, a house or emergencies: keep each one apart.', img: 'assets/savings-optin2.jpg', fit: 'contain', bg: '#ffffff', light: true },
                    { title: 'Save without thinking', text: 'Set a daily, weekly or monthly transfer and let it grow.', img: 'assets/savings-optin3.jpg', fit: 'contain', bg: '#ffffff', light: true },
                    { title: 'Hit your target', text: 'Track your progress and reach your goal, one step at a time.', img: 'assets/savings-optin4.jpg', fit: 'contain', bg: '#ffffff', light: true }
                ]
            }
        };
        const STORY_MS = 5000;
        let story = null, storyAt = 0, storyT0 = 0, storyLeft = STORY_MS, storyRaf = 0, storyHeld = false;
        function openStory(key) {
            story = STORIES[key];
            document.getElementById('storyBars').innerHTML = story.slides.map(() => '<span><i></i></span>').join('');
            const cta = document.getElementById('storyCta');
            cta.textContent = story.cta;
            cta.onclick = () => { window.location.href = story.go; };
            document.getElementById('story').classList.add('show');
            showSlide(0);
        }
        function closeStory() {
            clearTimeout(storyRaf);
            document.getElementById('story').classList.remove('show');
            story = null;
        }
        function showSlide(i) {
            storyAt = i;
            const sl = story.slides[i], el = document.getElementById('story');
            el.classList.toggle('light', !!sl.light);
            el.style.background = sl.bg;
            const ink = sl.light ? '#1c1c1c' : '#ffffff';
            document.getElementById('storySlide').innerHTML = '<div class="txt" style="color:' + ink + '"><h2>' + sl.title + '</h2><p>' + sl.text + '</p></div>'
                + '<div class="pic"><img src="' + sl.img + '" alt="" style="object-fit:' + sl.fit + ';object-position:center ' + (sl.fit === 'cover' ? 'center' : 'top') + '">'
                + '<span class="fade" style="background:linear-gradient(' + sl.bg + ', transparent)"></span></div>';
            document.querySelectorAll('#storyBars i').forEach((b, k) => { b.style.width = k < i ? '100%' : '0'; });
            storyLeft = STORY_MS;
            storyT0 = performance.now();
            clearTimeout(storyRaf);
            storyRaf = setTimeout(() => tickStory(performance.now()), 40);
        }
        function tickStory(now) {
            if (!story) return;
            if (storyHeld) { storyT0 = now - (STORY_MS - storyLeft); storyRaf = setTimeout(() => tickStory(performance.now()), 40); return; }
            const done = Math.min(1, (now - storyT0) / STORY_MS);
            storyLeft = STORY_MS * (1 - done);
            document.querySelectorAll('#storyBars i')[storyAt].style.width = (done * 100) + '%';
            if (done >= 1) { storyStep(1); return; }
            storyRaf = setTimeout(() => tickStory(performance.now()), 40);
        }
        function storyStep(d) {
            if (!story) return;
            const n = storyAt + d;
            if (n >= story.slides.length) { closeStory(); return; }
            showSlide(Math.max(0, n));
        }
        (function () {
            const el = document.getElementById('story');
            el.addEventListener('pointerdown', e => { if (!e.target.closest('.story-cta, .story-x')) storyHeld = true; });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, () => { storyHeld = false; }));
        })();

        /* Developer note beside the phone: what Send to Bank does from here
           while the account isn't linked yet (the 3000 Whitelist flow). */
        (function () {
            var linked = false;
            try { linked = sessionStorage.getItem('faydaActivated') === '1'; } catch (e) {}
            if (!linked && window.prototypeMode && window.prototypeMode.devNote) {
                window.prototypeMode.devNote('From both Send to Bank entry points, the homepage and the M-PESA bottom nav: after 900 ms on the Send to Bank screen, the link to Fayda popup appears.');
            }
        })();
    </script>
