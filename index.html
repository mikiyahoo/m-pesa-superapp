<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, initial-scale=1.0">
    <title>M-PESA App Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 360px;
            height: 808px; /* 760px screen + 48px system nav */
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* ---------- Status bar ---------- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 4px 16px;
            flex-shrink: 0;
            background: #ffffff;
        }

        .status-bar .time {
            font-size: 13px;
            font-weight: 600;
            color: #333333;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333333;
        }

        .status-icons svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            display: block;
        }

        /* ---------- Scroll ---------- */
        .scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .scroll::-webkit-scrollbar { display: none; }

        /* ---------- Green header ---------- */
        .header {
            background: linear-gradient(180deg, #0E7A38 0%, #26A652 52%, #43CB74 100%);
            padding: 28px 16px 20px 16px;
            color: #ffffff;
        }

        .greeting {
            display: flex;
            align-items: center;
            margin-bottom: 22px;
        }

        .greeting img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .greeting .hello {
            flex-grow: 1;
            min-width: 0;
        }

        .greeting .hello small {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.1;
        }

        .greeting .hello strong {
            display: block;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .header-actions svg {
            width: 23px;
            height: 23px;
            stroke: #ffffff;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
        }

        .tab {
            height: 33px;
            padding: 0 11px;
            border: none;
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            font-family: 'Barlow', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.15s ease;
            white-space: nowrap;
        }

        .tab.active {
            background: #ffffff;
            color: #128A3F;
        }

        /* balance */
        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .balance-label span {
            font-size: 15.5px;
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        .balance-label button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        .balance-label svg {
            width: 21px;
            height: 21px;
            stroke: #ffffff;
            stroke-width: 1.7;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .balance-amount {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .balance-extra {
            font-size: 15.5px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* quick actions */
        .quick {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .quick button {
            background: rgba(0, 0, 0, 0.13);
            border: none;
            border-radius: 8px;
            padding: 10px 8px 10px 8px;
            cursor: pointer;
            font-family: 'Barlow', sans-serif;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 84px;
            transition: background 0.15s ease;
        }

        .quick button:active { background: rgba(0, 0, 0, 0.2); }

        .quick .ic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: 0;
        }

        .quick .ic svg { width: 17px; height: 17px; }

        .quick .lbl {
            font-size: 12.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        /* ---------- Reward banner ---------- */
        .reward {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 16px 0 16px;
            padding: 12px 14px;
            border-radius: 8px;
            background: linear-gradient(100deg, #EE9A0C 0%, #F0A81C 55%, #E98C06 100%);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .reward .badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 2;
        }

        .reward .badge svg { width: 24px; height: 24px; }

        .reward .copy { flex-grow: 1; min-width: 0; z-index: 2; }

        .reward .copy small {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
        }

        .reward .copy strong {
            display: block;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .reward .explore {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 7px 14px;
            font-family: 'Barlow', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #E08700;
            cursor: pointer;
            flex-shrink: 0;
            z-index: 2;
        }

        .reward .explore svg { width: 14px; height: 14px; }

        .reward .trophy {
            position: absolute;
            right: 2px;
            bottom: -6px;
            width: 82px;
            height: auto;
            z-index: 1;
        }

        /* ---------- Suggested ---------- */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: #6E6E6E;
            letter-spacing: 1px;
            padding: 0 16px;
            margin: 24px 0 12px 0;
        }

        .suggested {
            display: flex;
            gap: 12px;
            padding: 0 16px 24px 16px;
            overflow-x: auto;
        }

        .suggested::-webkit-scrollbar { display: none; }

        .promo {
            width: 104px;
            height: 156px;
            border-radius: 8px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            background: #2A2A2E;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .promo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .promo .fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            background: radial-gradient(circle at 50% 62%, #45203C 0%, #241E2E 55%, #1C1B22 100%);
        }

        .promo .fallback .brand {
            font-size: 10px;
            font-weight: 600;
            color: #E8E8E8;
            text-align: right;
            letter-spacing: 0.3px;
        }

        .promo .fallback .apps {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .promo .fallback .apps span {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: block;
        }

        .promo .fallback .caption {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            line-height: 1.3;
        }

        /* ---------- QR floating button ---------- */
        .fab {
            position: absolute;
            right: 16px;
            bottom: 128px; /* clears the app nav (62px) + system nav (48px) */
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #1A73E8;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(26, 115, 232, 0.4);
            z-index: 15;
        }

        .fab svg { width: 28px; height: 28px; }

        /* ---------- Bottom navigation ---------- */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            padding: 8px 0 10px 0;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'Barlow', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #AAAAAA;
            padding: 2px 0;
        }

        .nav-item svg { width: 22px; height: 22px; }

        .nav-item img {
            width: 26px;
            height: 22px;
            object-fit: contain;
            opacity: 0.45;
            filter: grayscale(1);
        }

        .nav-item.active { color: #2BAF57; }

        .nav-item.active img { opacity: 1; filter: none; }

        /* ---------- Android system navigation ---------- */
        .system-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            justify-items: center;
            height: 48px;
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            color: #666666;
        }

        .system-nav svg { width: 19px; height: 19px; display: block; }

        /* ---------- Toast ---------- */
        .toast {
            position: absolute;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(9, 126, 70, 0.95);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 10px 16px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .masked { letter-spacing: 3px; }
    </style>
    <script src="assets/prototype-mode.js?v=9"></script>
</head>
<body>

    <div class="mobile-container">

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:00</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71L13.41 12l4.3-4.29ZM13 5.83l1.88 1.88L13 9.59V5.83Zm1.88 10.46L13 18.17v-3.76l1.88 1.88Z"/>
                </svg>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.1 8.9a14.2 14.2 0 0 1 19.8 0L12.9 20.3a1.1 1.1 0 0 1-1.8 0L2.1 8.9Z"/>

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <rect x="6.6" y="4.3" width="10.8" height="17.9" rx="2.2"/>
                </svg>
            </div>
        </div>

        <div class="scroll">

            <!-- Green header -->
            <div class="header">

                <div class="greeting">
                    <img src="assets/avatars/avatar-2.png" alt="">
                    <div class="hello">
                        <small>Hello,</small>
                        <strong>Zendu!</strong>
                    </div>
                    <div class="header-actions">
                        <button onclick="showToast('NOTIFICATIONS')" aria-label="Notifications">
                            <svg viewBox="0 0 24 24">
                                <path d="M18 8.6a6 6 0 1 0-12 0c0 6-2.4 7.4-2.4 7.4h16.8S18 14.6 18 8.6Z"/>
                                <path d="M13.7 19.6a2 2 0 0 1-3.4 0"/>
                            </svg>
                        </button>
                        <button onclick="showToast('INSIGHTS')" aria-label="Insights">

                                <path d="M4 20V13M9 20v-5M14 20v-9M19 20V9"/>

                                <path d="M17.2 2.8H21v3.8"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="setTab(this)">M-PESA</button>
                    <button class="tab" onclick="setTab(this)">AIRTIME</button>
                    <button class="tab" onclick="setTab(this)">INTERNET</button>
                    <button class="tab" onclick="setTab(this)">VOICE</button>

                <!-- Balance -->
                <div class="balance-label">
                    <span>M-PESA BALANCE</span>
                    <button onclick="toggleBalance()" aria-label="Hide balance">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M2.6 12S6.4 5.4 12 5.4 21.4 12 21.4 12 17.6 18.6 12 18.6 2.6 12 2.6 12Z"/>
                            <circle cx="12" cy="12" r="3.1"/>
                            <path id="eyeSlash" d="M4 20 20 4"/>
                        </svg>
                    </button>
                </div>

                <p class="balance-amount" id="balanceAmount">5,000 BIRR</p>
                <p class="balance-extra" id="balanceExtra">Eriff Balance: 500 BIRR</p>

                <!-- Quick actions -->
                <div class="quick">
                    <button onclick="showToast('SEND MONEY')">
                        <span class="ic">
                            <svg viewBox="0 0 24 24" fill="none">
                                <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3.4 18.2 10 4.6"/>
                                    <path d="M6.6 6.3 10 4.6l.8 3.7"/>
                                    <path d="M20.6 5.8 14 19.4"/>
                                    <path d="M17.4 17.7 14 19.4l-.8-3.7"/>
                                </g>
                            </svg>
                        </span>
                        <span class="lbl">Send<br>money</span>
                    </button>

                    <button onclick="showToast('PAY WITH M-PESA')">
                        <span class="ic">
                            <svg viewBox="0 0 24 24" fill="none">

                                <path d="M12.9 10 18.5 4.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                                <path d="M14.5 4.2h4.2v4.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="lbl">Pay with<br>M-PESA</span>
                    </button>

                    <button onclick="window.location.href='Buy Packages.html'">

                                <path d="M2 15.2 4.7 13.9 12 17.5 19.3 13.9 22 15.2 12 20 2 15.2Z" fill="#fff"/>
                            </svg>
                        </span>
                        <span class="lbl">Buy<br>package</span>

                    <button onclick="window.location.href='Send to Bank.html'">

                                <rect x="2.6" y="9.6" width="2.2" height="6.2" rx="0.6" fill="#fff"/>

                                <path d="M17.2 13.1h4.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                                <path d="M19.2 10.5 21.9 13.1 19.2 15.7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="lbl">Send to<br>bank</span>
                    </button>
                </div>
            </div>

            <!-- Reward banner -->
            <div class="reward" onclick="showToast('REWARD ACCOUNT')">

                        <path d="M5.4 14.6l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z" fill="#EE9A0C"/>
                    </svg>
                </span>
                <div class="copy">
                    <small>Reward Account</small>
                    <strong>250 BIRR</strong>
                </div>
                <button class="explore" onclick="event.stopPropagation(); showToast('EXPLORE REWARDS');">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M7 3.4h10v5a5 5 0 0 1-10 0v-5Z" fill="#E08700"/>

                <img class="trophy" src="assets/reward_account.png" alt="">

            <!-- Suggested -->
            <p class="section-label">SUGGESTED FOR YOU</p>

            <div class="suggested">
                <button class="promo" onclick="showToast('DALA STUDIO')">
                    <img src="assets/Dala-Banner-156-by-104-px.jpg" alt="Dala Studio">

        </div>

        <!-- QR scan -->
        <button class="fab" onclick="showToast('SCAN QR')" aria-label="Scan QR">

                <path d="M4 8.4V5.6c0-.9.7-1.6 1.6-1.6h2.8M15.6 4h2.8c.9 0 1.6.7 1.6 1.6v2.8M20 15.6v2.8c0 .9-.7 1.6-1.6 1.6h-2.8M8.4 20H5.6c-.9 0-1.6-.7-1.6-1.6v-2.8" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

                <rect x="12.8" y="12.8" width="3.6" height="3.6" rx="0.9" fill="#fff"/>
                <rect x="12.8" y="7.6" width="3.6" height="3.6" rx="0.9" fill="#fff"/>
                <rect x="7.6" y="12.8" width="3.6" height="3.6" rx="0.9" fill="#fff"/>
            </svg>
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="showToast('HOME')">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M3.4 10.4 12 3.6l8.6 6.8V20a1 1 0 0 1-1 1h-5v-6h-5.2v6h-5a1 1 0 0 1-1-1v-9.6Z" fill="currentColor"/>
                </svg>
                <span>HOME</span>
            </button>
            <button class="nav-item" onclick="window.location.href='Home Screen.html'">
                <img src="assets/M-PESA%20Icon.svg" alt="">
                <span>M-PESA</span>
            </button>
            <button class="nav-item" onclick="showToast('SAFARICOM')">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="7" y="2.6" width="10" height="18.8" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <span>SAFARICOM</span>
            </button>
            <button class="nav-item" onclick="showToast('MINI APPS')">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="2.9" y="3.1" width="7.6" height="7.6" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M17.3 2.9 21.2 10.7h-7.8l3.9-7.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <circle cx="6.7" cy="17.5" r="3.8" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="17.3" cy="17.5" r="3.8" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <span>MINI APPS</span>
            </button>
        </nav>

        <!-- Android System Navigation -->
        <div class="system-nav">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14.8 4.8 6 12l8.8 7.2V4.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="6.9" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="5.4" y="5.4" width="13.2" height="13.2" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        /* ---------- Tabs ---------- */
        function setTab(btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            showToast(btn.textContent.trim());
        }

        /* ---------- Balance ---------- */
        let visible = true;
        function toggleBalance() {
            visible = !visible;
            const amount = document.getElementById('balanceAmount');
            const extra = document.getElementById('balanceExtra');
            const slash = document.getElementById('eyeSlash');

            if (visible) {
                amount.textContent = '5,000 BIRR';
                extra.textContent = 'Eriff Balance: 500 BIRR';
                amount.classList.remove('masked');
                slash.style.display = '';
            } else {
                amount.textContent = '*****';
                extra.textContent = 'Eriff Balance: *****';
                amount.classList.add('masked');
                slash.style.display = 'none';
            }
        }

        /* ---------- Toast ---------- */
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }
    </script>
</body>
</html>
